name: "Gettiered by Accommodating Environment"
descriptions:
  - "S is in an environment that features a regularity: Whenever S forms the belief p~1~ (or a belief in a p-type proposition), an interference takes place, making p~1~ (or the p-type proposition) true. S is unaware of this regularity. S forms the belief that p~1~ based on false premises. However, the interference takes place and makes p~1~ true."
comments: 
  - "Grundmann (2020) intuits about Mr. Light 2: “Intuitively, one would not attribute knowledge to Mr. Light[.]” (5182.)"
tokens:
  - "Grundmann’s (2020) Mr. Light 2: “It is Mr. Light’s job to register whether the lights are on or off in the rooms of a big hotel. He consults a table with many little lights on it, each of which refers to a specific room in the hotel. On noticing that some little light is on, Mr. Light immediately believes that the lights in the respective room are on, and vice versa. Unbeknownst to Mr. Light, none of the little lights registers the status of the lights in the respective hotel room. […] A demon adjusts the lighting status of the hotel rooms to Mr. Light’s beliefs (about the light in the rooms), which are based on the random variation of the little lights on his table. When Mr. Light sees that the little light for room 23 is on, he forms the true belief that the lights are on in room 23.” (5181f.)"