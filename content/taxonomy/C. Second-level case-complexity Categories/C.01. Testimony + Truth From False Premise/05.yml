name: "Gettiered Receiver of False Testimony"
descriptions:
  - |
    q is false, but attester R asserts that q. S believes that q based on this testimony. q (deductively, inductively, or abductively) entails that p. Based on this entailment between q and p, S forms the belief that p. There is a backup-truth-maker for p, so p happens to be true. 
    
    The backup truth-maker is independent of the presence of misleading evidence for q: In some modally close worlds q would be false and R would attest that q. S would come to believe that p based on the false belief that q, but no backup truth-maker would be present, so p would be false."
comments:
  - "Gettier (1963) intuits about Coins: “Smith does not know that (e) is true[.]” (122.)"
  - "Nagel et al. (2013) investigated Vacation Chat in their x-phi study, but deliver results on this vignette aggregated with another I’d classify as a token of [Unfriendly Environment] (see B.3.). They report that 41.1% of participants ascribed lack of knowledge or that it was unclear whether the agent knew (657). Of those who initially ascribed knowledge, a further 23.6% indicated that it’s actually more adequate to describe the agent as ‘feeling like they know’ rather than ‘knowing’ (657). Their experiment had a sample size of n = 238, with 30 participants excluded for not completing the survey or completing it suspiciously quickly (655)."
tokens:
  - |
    Gettier’s (1963) Coins: “Smith and Jones have applied for a certain job. […] Smith has strong evidence for the following conjunctive proposition: (d) Jones is the man who will get the job, and Jones has ten coins in his pocket. 
    
    Smith’s evidence for (d) might be that the president of the company assured him that Jones would in the end be selected, and that he, Smith, had counted the coins in Jones’s pocket ten minutes ago. Proposition (d) entails: (e) The man who will get the job has ten coins in his pocket. 
    
    Let us suppose that Smith sees the entailment from (d) to (e), and accepts (e) on the grounds of (d), for which he has strong evidence. […] unknown to Smith, he himself, not Jones, will get the job. And, also, unknown to Smith, he himself has ten coins in his pocket.” (122.)
  - "Nagel et al.’s (2013) Vacation Chat: “Does Luke know whether or not one of his co-workers recently vacationed in Las Vegas? […] Luke works in an office with two other people, Victor and Monica. All winter Victor has been describing his plans to go to Las Vegas on his vacation, even showing Luke the website of the hotel where he has reservations. When Victor is away on vacation, Luke sees Victor’s Facebook photos of himself with Vegas landmarks in the background, together with status updates about how much he is enjoying his trip. When he gets back to work, Victor talks a lot to Luke about how much fun he had vacationing in Las Vegas. However, Victor didn’t really go on the trip; he has just been pretending. His tickets and reservations were cancelled because his credit card was maxed out, and he secretly stayed home in Markham, very skillfully faking the Facebook pictures using Photoshop. Meanwhile, Monica just spent a weekend vacationing in Las Vegas, but kept this a secret from all her co-workers.” (660.)"
  - "Cat on the Couch 3b: Klara asserts to Stefan that the cat is sitting on the armrest, which, since the armrest is part of the couch, would entail that the cat sits on the couch. However, it’s not true that the cat sits on the armrest, it’s sitting on the seating area. Klara is lying about this, because she has made a stain on the armrest earlier, and she hopes this way she’ll be able to blame it on the cat. Stefan believes Klara, he comes to believe that the cat is sitting on the couch, which is true."