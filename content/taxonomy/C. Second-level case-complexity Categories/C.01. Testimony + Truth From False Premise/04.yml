name: "Gettiered  by an Attester with Unsuitable Reason"
descriptions:
  - |
    p is true, but R believes that p based on [Unsuitable Reason]. R asserts that p. Based on the false (explicit or implicit) premise that R is a trustworthy and reliable attester about p, S forms the belief that p based on R’s testimony.
  
    R’s willingness to attest that p is independent of the matter of fact that p is true is true: In modally close worlds where p would be false, R would belief and attest that p anyway, and S would gain a false belief that p.
comments:
  - "Lackey (2008) intuits about Albatross: “Now, does Fred believe with justification or warrant that albatrosses have the largest wingspan among wild birds on the basis of Pauline’s report? Intuitively, no.” (149.)"
  - "Lackey (2008) intuits about Stolen Purse: “[H]is true belief about the stolen purse [is] […] not an instance of knowledge” (153.)"
  - "Lackey (2008) intuits about Horned Owl: “Does Eleanor know that there was a great horned owl in a neighborhood tree? Intuitively, no[.]” (159.)"
tokens:
  - "Lackey’s (2008) Albatross: “Fred has known Helen for five years and, during this time, he has acquired excellent epistemic reasons for believing her to be a highly reliable source of information on a wide range of topics. […] Yesterday, Helen told Fred that Pauline, a close friend of hers, is a highly trustworthy person, especially when it comes to information regarding wild birds. Because of this, Fred unhesitatingly believed Pauline earlier today when she told him that albatrosses, not condors (as is widely believed), have the largest wingspan among wild birds. It turns out that while Helen is an epistemically excellent source of information, she was incorrect on this particular occasion: Pauline is, in fact, a highly incompetent and insincere speaker, especially on the topic of wild birds. Moreover, though Pauline is correct in her report about albatrosses, she came to hold this belief merely on the basis of wishful thinking (in order to make her reading of *The Rime of the Ancient Mariner* more compelling).” (149.)"
  - "Lackey’s (2008) Stolen Purse “Max has known Ethel for ten years and, over the course of these years, he has acquired excellent epistemic reasons for believing her to be a highly reliable source of information on a wide range of topics. Indeed, during this time, she has never offered, to Max or anyone else, a report that has been either insincere or improperly formed. Currently, however, Ethel is in the midst of a personal crisis, which she effectively conceals from those around her, and her emotional state of mind leads her to report to Max that her purse has been stolen, despite having absolutely no evidence for thinking this to be the case. Max, detecting nothing amiss, readily accepts Ethel’s testimony. Now, it turns out that Ethel’s purse was in fact stolen: while she was at a coffee shop earlier today, a young man slipped it off her chair and into his backpack.” (152.)"
  - "Lackey’s (2008) Horned Owl: “Margaret is an extremely incompetent epistemic agent, continually forming perceptual beliefs without wearing her required prescription eyeglasses, testimonial beliefs on the basis of reading The National Enquirer, introspective beliefs when she is intoxicated, and so on. One day, Margaret again fails to wear her corrective lenses and forms the belief that there is a great horned owl in a tree 50 feet away. Her belief happens to be true. Later that day, Margaret meets someone on the street named Eleanor, reports her owl sighting to her, and Eleanor comes to believe that there was a great horned owl in a neighborhood tree on the basis of Margaret’s testimony. Moreover, since it is possible for great horned owls to be in this neighborhood and Eleanor knows nothing about Margaret’s epistemic habits, there are no undefeated defeaters for the report in question, that is, Eleanor neither believes nor has evidence available to her such that she should believe that Margaret’s report is false or unreliable.” (158.)"