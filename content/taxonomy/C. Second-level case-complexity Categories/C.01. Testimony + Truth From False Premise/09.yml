name: "Gettierd Transmission of False Testimony"
descriptions:
  - |
    q is false, but attester R asserts that q. However, S misunderstands (because external factors influence the transmission, S is inattentive, etc.) R to say that p. Falsely assuming that R’s testimony is reliable, S beliefs that p. As it so happens, p is true.
    
    The problem with the transmission is independent of R’s willingness to attest a falsehood: In some modally close worlds q would be false and R would attest that q, but the transmission would be successful. S would come to believe that q based on [False Testimony].
comments:
  - "Besson (2009) intuits about Whirlwind: “Intuitively, Nate acquires the justified true belief […] in the rule (MP). But he does not know it. For the process through which he acquired this belief was not reliable.” (4.)"
tokens:
  - "Besson’s (2009) Whirlwind: “Suppose Nate wants to learn the rules of logic […] Brenda, who is a renowned expert in logic, agrees to teach him. […] [S]he intends to begin by teaching him the rules for ‘if’, that is to say, the rules of conditional proof and modus ponens. […] As Brenda and Nate are on a desert island, the teaching is to be oral; she plans to tell him the two rules and perhaps give him a few of their instances. She starts with the rule of conditional proof (CP) […] The teaching goes well with (CP), which Nate now understands. But when she turns to the rule of modus ponens, Brenda gets tired and irritated. She decides to trick Nate, and sets about teaching him a fallacy. She will not teach him the correct rule of modus ponens, which says that MP. From *if p, then q*, and *p*, one may infer that *q*. […] Instead of (MP), Brenda decides to teach Nate the incorrect rule known as the fallacy of asserting the consequent (AC), which says that AC. From *if p, then q*, and *q*, one may infer that *p*. […] Suppose that by sheer coincidence, just at the times when Brenda is about to utter (AC) […] there is a whirlwind of sorts between her mouth and Nate’s ear, which they both fail to detect. The effect of this whirlwind is that although Brenda utters the rule (AC), Nate hears the rule (MP).” (3f.)"