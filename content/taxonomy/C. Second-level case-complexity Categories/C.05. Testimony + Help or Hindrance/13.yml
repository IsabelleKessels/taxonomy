name: "Correct Reasoning that Cognitive Hindrance Cancels Consistent Lying out"
descriptions:
  - "Some factor systematically influences attester R’s normal belief-formation processes when it comes to p type beliefs. Whenever R observes p~1~, it sets R into a state of believing that non-p~1~ (or that p~n~, where p~n~ is false). There is another factor, influencing R’s cognitive processes, making R a consistent liar about their p-type beliefs: Whenever R beliefs that non-p~1~ (or that p~n~) R will attest that p~1~. S knows about the factors that influence R’s belief-formation and attestation. Based on this and R’s testimony that p~1~, S infers that p~1~. p~1~ is true."
comments: 
  - "In Lackey’s (2008) Consistent Liar 1, receiver S isn’t aware of the regularity between Bertha’s disposition to form false beliefs but give testimony to the contrary; thereby introducing the additional complication of {{< sc >}}Epistemically Noteworthy Environments{{< /sc >}}."
tokens:
  - "Consistent Liar 2: The initial set-up is identical to Lackey’s (2008) Consistent Liar 1 (see D., [Unknown Regularity: Correct Reasoning that Cognitive Hindrance Cancels Consistent Lying out]): “When Bertha was a teenager, she suffered a head injury […] and, shortly afterwards, became quite prone to telling lies, especially about her perceptual experiences involving wild animals. After observing this behavior, her parents became increasingly distressed and […] finally took her to see a neurosurgeon, Dr Jones. Upon examining her, Dr Jones noticed a lesion in Bertha’s brain which appeared to be the cause of her behavior, and so it was decided that surgery would be the best option to pursue. Unfortunately, Dr Jones discovered during the surgery that he couldn’t repair the lesion - instead, he decided to modify her current lesion and create another one so that her pattern of lying would be extremely consistent and would combine in a very precise way with a pattern of consistent perceptual unreliability. Not only did Dr Jones keep the procedure that he performed on Bertha completely to himself, he also did this with the best of intentions, wanting his patient to function as a healthy, happy, and well respected citizen. As a result of this procedure, Bertha is now – as a young adult – a radically unreliable, yet highly consistent, believer with respect to her perceptual experiences about wild animals. For instance, nearly every time she sees a deer, she believes that it is a horse […]. At the same time, however, Bertha is also a radically insincere, yet highly consistent, testifier of this information. For instance, nearly every time she sees a deer and believes that it is a horse, she insincerely reports to others that she saw a deer […]. Moreover, because of her consistency as both a believer and a liar, those around her do not have any reason for doubting Bertha’s reliability as a source of information.” (53f.) In this version, Bertha one day runs into Dr Jones and “insincerely though correctly report[s] to him that she saw a deer on a nearby hiking trail” (54). Correctly reasoning from Bertha’s testimony and his knowledge about the effect of the lesion, Dr Jones forms the true belief that there was a deer on the hiking trail."