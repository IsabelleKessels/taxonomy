name: "Unsuccessful Transmission Rectified by Sensory Help"
descriptions:
  - "A trustworthy and reliable attester, R, asserts that p: p is true. Some factor influences S’s sensory organs or perceptual process such that S’s perception of the testimony is improved. Without the factor’s influence S would have misunderstood R’s testimony."
comments: []
tokens:
  - "Celtic Chat 10: Talking on the phone to discuss the ideal formation of tonight’s match, Luke truthfully asserts to Caitlin: “Cameron Carter-Vickers has recovered from his injury.” Since Luke speaks very softly and there is some background noise, Caitlin almost would have misheard and come to believe that Cameron Carter-Vickers *hasn’t* recovered from his injury. However, her hearing aids, which have a program on which voices are amplified while background noise is filtered out, enable her to correctly understand “Cameron Carter-Vickers has recovered from his injury,” which is true. Caitlin accepts Luke’s testimony."