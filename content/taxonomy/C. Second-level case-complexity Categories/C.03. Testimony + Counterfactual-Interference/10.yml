name: "Counterfactually Distorting Transmission Process"
descriptions:
  - |
    In the @-world a trustworthy and reliable attester, R, asserts that p: p is true and S forms the belief that p based on this testimony. S has no delusional beliefs about what makes R trustworthy and reliable. 

    In modally close possible worlds, where R would assert that p (via the same, or different, transmission process), some interference would distort the message so that S would understand it to mean non-p (or p~n~, where p~n~ is false). S would form the false belief that non-p~1~ (or p~n~).
comments: []
tokens:
  - "Auntie Jana 3: Riley wants to tell Sara that their auntie Jana is turning *seventy-one* on Sunday. Riley could dictate a message, send a voice-note or write a text. Riley decides to write a text and, upon reading it, Sara comes to believe that Jana is turning *seventy-one* on Sunday. Riley’s speech is clipped, and had she used another form of communication, either the dictation software would have transcribed, or Sara would have misheard, that auntie Jana is turning *seventy on* Sunday."
  - "Inhouse Mail 2: The situation is as in Inhouse Mail 1 (see [Counterfactually Failed Transmission Process]), except that the four unreliable temps randomly alter the content of the messages they deliver, rather than not delivering messages at all."