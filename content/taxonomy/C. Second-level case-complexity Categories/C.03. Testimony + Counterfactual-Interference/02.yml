name: "Silent Approval of Counterfactual-Interference Affecting the Attester"
descriptions:
  - |
    p is true, but attester R believes that p based on [Counterfactual-Interference in Modally Close non-p-Worlds], [Counterfactual-Interference in Modally Close p-Worlds], [Instrument Counterfactual-Interference in Modally Close non-p-Worlds] or [Instrument Counterfactual-Interference in Modally Close p Worlds]. R asserts that p to S, in the presence of agent T. T is a reliable and trustworthy agent who believes that p based on

    - [Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises], or
    - [Successful Testimony] by a fourth attester (U).

    T silently approves of R’s testimony. In modally close possible worlds, where R would have attested a falsehood about p, T would have formed a true belief about whether p on equivalent evidence as used in the @-world, and would interject to correct R’s testimony.

    S believes that p based on the combination of R’s testimony and T’s silent approval. In general, R is a trustworthy and reliable attester and S has no delusional beliefs about what makes R or T trustworthy, or T reliable regarding p.
comments:
  - "Goldberg (2005) states about Unreliable Milk Dumper: “Sonny comes to know through Mary’s testimony that there is milk in the fridge.” (302) – However, Goldberg explicitly *argues* for this interpretation; he avoids disclosing whether this was his initial intuition about the case. The token receives attention in the armchair literature, for whether it amounts to “testimonial knowledge through unsafe testimony” (303); not for whether or not it amounts to an instance of knowledge (see also B.1., [Correct Reasoning from an Unreliable Attester’s Testimony]). Lackey (2008) states that: “Sonny does come to know that there is milk in the refrigerator, but not on the basis of Mary’s testimony.” (80.) The authors agree that Sonny knows, they disagree as to whether it’s an instance of testimonially based knowledge (see also Goldberg 2001)."
tokens:
  - "Goldberg’s (2005) Unreliable Milk Dumper: “Frank is a writer with a strange habit. Every morning, at precisely 7:30 a.m., he wakes up and dumps out whatever is left of the pint of milk he purchased the day before, but places the empty carton back in the fridge until noon. Then, throughout the interval from 7:30 to noon, he always remains in the kitchen, as that is where he writes every morning like clockwork. Finally, at exactly noon, he takes the now-empty milk carton out of the fridge and throws it away […]. Now Mary is unaware of Frank’s milkdumping practice. One morning, having spent the prior evening at Frank’s house with Frank and her son Sonny, she awakens at 7:40 and goes to the kitchen with Sonny. Upon entering (Frank is already there) she immediately goes to the fridge for a glass of OJ, and as she reaches for the OJ she casually observes a small carton of milk. She goes on to tell Sonny (who always has cereal with milk for breakfast) that there is milk in the fridge. As luck would have it, there is indeed milk in the carton on this day (Frank failed to remember that he had bought milk yesterday). When Frank observes Mary’s testimony, he realizes that he forgot to dump the milk; when Sonny observes her testimony, he forms the belief that there is milk in the fridge.” (302.)"
