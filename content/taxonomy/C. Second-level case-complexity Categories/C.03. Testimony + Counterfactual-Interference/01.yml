tokens:
  - "Demon Clock 3: Everything is as in Kelp’s (2009) Demon Clock 1 (see B.4., [Instrument Counterfactual-Interference in Modally Close non-p-Worlds]), except that, in this version, Russell asserts “It’s 8:22” to another person, Chris, upon reading the clock. Chris forms a true belief that it’s 8:22 based on this testimony."

