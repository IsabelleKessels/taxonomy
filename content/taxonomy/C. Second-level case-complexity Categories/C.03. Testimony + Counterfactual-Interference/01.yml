name: "Counterfactual-Interference Affecting the Attester"
descriptions:
  - |
    p is true, but attester R believes that p based on [Counterfactual-Interference in Modally Close non-p-Worlds], [Counterfactual-Interference in Modally Close p-Worlds], [Instrument Counterfactual-Interference in Modally Close non-p-Worlds] or [Instrument Counterfactual-Interference in Modally Close p Worlds]. R asserts that p, S believes that p based on this testimony. In general, R is a trustworthy and reliable attester and S has no delusional beliefs about what makes R trustworthy.
