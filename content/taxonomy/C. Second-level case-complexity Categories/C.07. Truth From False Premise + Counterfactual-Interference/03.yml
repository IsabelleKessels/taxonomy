name: "Counterfactually not Gettiered"
descriptions:
  - |
    In the @-world p is true, but S believes that p based on [Direct Gettier] or [False Premise Gettier].

    In modally close possible worlds, p would be true, but there would be an interference which would remove the misleading evidence that S encounters in the @-world. S would form the belief that p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S would be perceiving in the moment.
comments: 
  - "I’m unaware of armchair based intuition-reports or empirical studies investigating intuitions on tokens of this [case-type]; but investigating tokens of this [type] might be of value to debates around *safety* or *anti-luck* theories of knowledge. What’s remarkable about this [case-type] is that the agent’s belief is true both in the @-world and in modally close possible words. In the @-world, however, there is no proper *causal connection* (in the sense described by Goldman 1967) between S’s reason for believing that p and the matter of fact described by p. Presuming we observe a uniform evaluation-behaviour on cases of this [type], we might get some indication which general conditions for knowledge is more compatible with intuitions about this case: the demand for a belief’s safety across modally close possible worlds, or the requirement for a causal connection. See also [Actually and Counterfactually Gettiered]."
tokens:
  - "Holography Vase: The initial set-up is that of a case described by Lehrer and Paxson (1969): “Imagine that holography has been so perfected that a laser-illuminated hologram of an object can, under certain observational conditions, be indistinguishable from the real thing. More particularly, suppose that a man, Mr. Promoter, seeking to demonstrate the remarkable properties of laser photography, constructs a boxlike device which contains a vase, a laser photograph of the vase, and a laser source by which the photograph may be illuminated. The device is so constructed that Mr. Promoter by turning a knob may show a viewer the vase or the illuminated laser photograph of the vase, and the visual experience of the viewer when he sees the vase will be indistinguishable from his visual experience when confronted with the photograph. Of course, the very purpose of constructing the device is to arrange things so that people will be completely deceived by the photograph. Now suppose I walk up to the viewer, […] [b]lissfully ignorant of the technical finesse being used to dupe me, I take what I see to be a vase. I believe that the box contains a vase. I am right, there is a vase in the box, and it is not at all accidental that I am right. For Mr. Promoter has constructed the device in such a way that, though I do not see the vase, I will believe quite correctly that there is one there. […], imagine that, contrary to the preceding example, Mr. Promoter turns off his device for the day, leaving the knob set so that when I enter the room the vase is before my eyes.” (234f.) In this version, suppose that, in the @-world, Mr. Promoter doesn’t turn the knob just before I walk in; however, in close possible worlds, he would turn the knob."