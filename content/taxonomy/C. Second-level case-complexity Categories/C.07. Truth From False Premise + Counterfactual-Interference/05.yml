name: "Actually and Counterfactually Gettiered"
descriptions:
  - |
    In the @-world p is true, but S believes that p based on [Direct Gettier] or [False Premise Gettier].
    
    In modally close possible worlds, p would be true, but there would be an interference which would provide different misleading evidence to S as compared to the @ world. S would form the belief that p based on a different instance of [Direct Gettier] or [False Premise Gettier].
comments: 
  - "I’m unaware of armchair based intuition-reports or empirical studies investigating intuitions on tokens of this [case-type]; but investigating tokens of this [type] might be of value to debates around *safety* or *anti-luck* theories of knowledge. What’s remarkable about this [case-type] is that the agent’s belief is true both in the @-world and in modally close words. Neither in the @ world nor in modally close possible worlds, however, is there a proper *causal connection* (in the sense described by Goldman 1967) between S’s reason for believing that p and the matter of fact described by p. Presuming we observe a uniform evaluation-behaviour on cases of this [type], we might get some indication which general condition for knowledge is more compatible with intuitions about this case: the demand for a belief’s safety across modally close possible worlds, or the requirement for a causal connection. See also [Counterfactually not Gettiered]."
tokens:
  - "Sheep 2: As in Chisholm’s (1966/1989) Sheep 1 (see B.2., [Direct Gettier]), a person, let’s call her Alex, “*takes* there to be a sheep in the field and does so under conditions which are such that, when under those conditions a person takes there to be a sheep in the field, then it is *evident* for that person that there is a sheep in the field. The person [Alex; IK], however, has mistaken a dog for a sheep and so what [s]he sees is not a sheep at all. Nevertheless it happens that there *is* a sheep in another part of the field.” (93.) In this version, suppose there is a benevolent demon who wants to ensure Alex gains a true belief about whether there is a sheep in the field. In modally close possible worlds in which the dog Alex is looking at wouldn’t be present in the field and the sheep would be hidden from view, the demon would make a rock appear which, from the distance, would look just like a sleeping sheep. Alex would mistake the rock for a sheep and gain the true belief that there is a sheep in the field."