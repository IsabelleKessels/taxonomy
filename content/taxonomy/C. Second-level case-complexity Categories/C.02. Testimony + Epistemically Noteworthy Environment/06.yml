name: "Correct Reasoning From Testimony of an Attester in an Unfriendly Environment"
descriptions:
  - "q is true, but attester R believes that q based on [Unfriendly Environment] or [Unfriendly Instruments Environment]. R asserts that q. S is aware of the conditions of the environment R is in. Correctly reasoning from the information S has about R’s environment, and the fact that R asserts that q, S makes an inference that p, and forms the true belief that p."
comments:
  - "Lackey (1999) intuits about Farmer Brown’s Barn: “I can come to know via your testimony that he has a new barn on his farm.” (487.)"
  - "Pelling’s (2013) evaluation that Red Barn is a case of knowledge is left implicit. Pelling presents it as a “safe testimonial belief from unsafe testimony” (209)."
tokens:
  - "Lackey’s (1999) Farmer Brown’s Barn: “[S]uppose that Farmer Brown and I are very good friends, and I have every reason to believe that he is an honest and sincere man. Several weeks ago we were having coffee and he told me that even though he does not have a real barn himself, he is vehemently opposed to a trend in his community towards making the neighbourhood appear prosperous by putting up barn façades. Today you drive past Farmer Brown’s farm, notice that he has a new barn, and report this fact to me. You do not know, however, that his barn is the only real one in his community, surrounded by façades which from a distance are indistinguishable from his barn. This being so, you do not know that Farmer Brown has a new barn, because there is a factual defeater, namely, that there are barn façades surrounding the real barn, which prevents you from having knowledge. […] But, given my belief that Farmer Brown has vehemently spoken out against barn facades, it seems reasonable to say that such alternatives are eliminated with respect to my accepting your testimony. […] I have no reason to doubt your report and I have good reason to believe that, even if Farmer Bown’s new barn were surrounded by façades, his would be a real one.” (487f.)"
  - "Pelling’s (2013) Red Barn: “John phones me to say that he can see a (real) red barn. Although John’s testimony is true, it might easily have been false. For unbeknown to him the area contains many fake barns which until yesterday were painted red. However, I happen to know that all the fakes have now been repainted blue: the only remaining red barn in the area is real. I thereby come to believe, partly on the basis of John’s testimony and partly on the basis of my background knowledge, that John can see a red barn.” (209.)"