tokens:
  - |
    Broken Thermometers 8: As in Goldman’s (1986) Broken Thermometers 1 (see B.3., [Unfriendly Instruments Environment]), “there are many thermometers in the parent’s medicine cabinet, and all but […] one […] are defective. All others would read 98.6 even if the child had a fever. Furthermore, the parent cannot tell which thermometer is which[.]” (45.) One day, while on a visit to her family (who only own reliable thermometers), Hanne notices her child is unusually fussy and looks flushed. Someone gives her a reliable thermometer to take the child’s temperature: It shows 100.5, indicating that the child has a mild fever. Hanne believes this, so she decides to cut her visit short and travels home. 

    Upon her return, Hanne takes her child’s temperature with one of the thermometers from her own medicine cabinet. Coincidentally, she picks the reliable one. Taking her child’s temperature, the thermometer displays 98.6, and Hanne comes to believe that her child doesn’t have a fever anymore, which is true. 
