name: "Change of Truth Value & Basis for Belief: Unfriendly Environment – Multiple-Iteration"
descriptions:
  - |
    At t~1~ some p-type proposition(s), p~n~, is false, but S believes that p~n~ based on [Misperception] and/or [False Reasoning] relating to what S perceives or remembers in the moment. 

    At t~2~ p~1~ is true (where p~n~ ≠ p~1~), but S believes that p~1~ based on one [Unfriendly Environment] or [Unfriendly Instruments Environment]. S remains in the same noteworthy environment between t~1~ and t~2~, which features misleading evidence in regards to p-type propositions.
comments: 
  - "This [case-type] differs from [Change of Truth Value & Basis for Belief: Paradigmatic Lack of Knowledge to Unfriendly Environment] in that S’s belief between t~1~ and t~2~ is about different propositions – p~1~ and p~n~. In order to fit the [case-type] into the overview table presented earlier, I assume that the change from p~1~ to p~n~ represents a change in truth value. Nothing depends on this choice; classifying this as a *Change of Exact Proposition Believed & Basis for Belief* would be perfectly acceptable. I adopt the term ‘multiple-interation’ from Turri’s (2017) paper on this [case-type]."
  - "DeRose (2009) reasons about Fake Barns Multiple-Iteration “Hopefully, though, in this case, in which Henry is not only in a region teeming with fake barns, but has actually been fooled by many of them, and the current, real barn seems to him just like the other objects, you will intuit quite strongly that Henry doesn’t know that what he’s seeing is a barn. If that doesn’t work, imagine that Henry then goes on to encounter 20 more fake barns, confidently taking all of them to be real barns. So now he’s 1-for-40 in his barn judgements, with the one ‘hit’ among the many ‘misses’ occurring right in the middle of a sea of errors. If you *still* think that Henry knows on the lone occasion on which he’s getting it right, then, while there are further modifications to the example we might still try, you are probably beyond the reach of my help here.” (23, fn. 24.)"
  - "Turri (2017) investigated a version of Fake Barns Multiple-Iteration in his x-phi study. His results conflict with DeRose’s (2009) own intuition and his expectations for other people’s intuition – at least to some extent. In Turri’s (2017) vignette, the agent encounters and forms false beliefs about four fakes before encountering the real barn. Amongst other factors, Turri tests how knowledge-judgements compares to the original Fake Barns (where the agent only encounters and forms a belief about a single structure: namely, the real barn) and reports that, as long as both vignettes specified that the misleading evidences where ‘fake’ barns (rather than using a vaguer term like ‘structure’), the “mean knowledge judgment did not differ between the single condition and multiple condition” (108). Turri asked participants to indicate whether they agreed with the statement that the agent knew there was a barn on a 7-point Likert scale where 7 indicated maximal agreement. The result for Fake Barns Multiple-Iteration was M = 4.74, albeit with SD = 2.07 (115). Moreover, the experiment’s sample size was rather small, with n = 39 for the condition in question (115). Thus, further research is needed to see if the results replicate. Moreover, it should be noted that DeRose (2009) suggests to use a case with a higher number of iterations, to conclusively dissuade people from ascribing knowledge."
tokens:
  - "DeRose’s (2009) Fake Barns Multiple-Iteration: “Imagine that Henry *has* encountered many of the fake barns (let’s say 19 of them), and has been fooled by all of them that he has encountered, believing them to be real barns. Now, he’s encountering the only real barn in the region (so he is 1-for-20 in his barn judgements), but it seems the same to him as all the other objects he has taken to be barns: He is not in any way more confident of his identification of the object as a barn in the case as compared with all the other instances. (‘Yet *another* barn,’ he thinks.) Make sure you’re imagining the case so that the fakes present an extremely convincing real appearance—just like the real thing—and Henry should have the same visual evidence as he would have had if all the barns around were real, and should be just as justified in thinking that what he is presently looking at is a barn as he would have been if all the barn-like things he had encountered had all been real.” (23, fn. 24.)"
  