name: "Change of Truth Value, Basis for Belief & Doxastic Attitude: Paradigmatic Lack of Knowledge to Unfriendly Environment"
descriptions:
  - |
    At t~1~ p is true, but S believes that p based on [Unsuitable Reason]. 

    At t~2~ p is false, but S believes that non-p based on [Unfriendly Environment] or [Unfriendly Instruments Environment].
comments: 
  - |
    To make Broken Thermometers 10 conform with the [case-type], p must include a negation: 
    
    p = “The child has *no* fever.”; non-p = “It’s *not* the case that the child has *no* fever.” = “The child has a fever.”

tokens:
  - |
    Broken Thermometers 10: As in Goldman’s (1986) Broken Thermometers 1 (see B.3., [Unfriendly Instruments Environment]), “there are many thermometers in the parent’s medicine cabinet, and all but […] one […] are defective. All others would read 98.6 even if the child had a fever. Furthermore, the parent cannot tell which thermometer is which[.]” (45.) One morning, Hanne’s child is unusually fussy and looks flushed. Based on wishful thinking, and despite these potential signs that the child may have developed a fever, Hanne forms the belief that it doesn’t. As it so happens, this is true.

    A couple of hours later, though, Hanne decides that she needs to check that everything is alright: She takes her child’s temperature, coincidentally with the reliable thermometer. It displays 100.5, and Hanne comes to believe that her child does now have a fever, which is true.