name: "Change of Basis for Belief: Unfriendly Environment to Paradigmatic Knowledge"
descriptions:
  - |
    At t~1~ p is true, but S believes that p based on [Unfriendly Environment] or [Unfriendly Instruments Environment]. 

    At t~2~ p is true and S believes that p based on Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises], but also based on remembering the evidence S had at t~1~ alongside the true premise that nothing has interfered which might falsify p between t~1~ and t~2~.
comments: []
tokens:
  - |
    Fake Barns Over Time 3: As in Goldman’s (1976) Fake Barns (see B.3., [Unfriendly Environment]), Henry is in Fake Barn County and looks out of his car window at the genuine barn. He forms the true belief that the structure is a barn.

    Later that week, Henry passes the spot where he identified the barn again. He decides to take a break, gets out of the car and circles around the barn on foot.