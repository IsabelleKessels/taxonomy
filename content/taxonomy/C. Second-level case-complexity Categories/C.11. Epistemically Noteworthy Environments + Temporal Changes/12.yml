tokens:
  - |
    Fake Barns Over Time 6: The council of the local farmer’s association in Fake Barn County decided that several of the remaining genuine barns in the area should be turned into barn-façades over the coming weeks, so there is ongoing construction work. As in Goldman’s (1976) Fake Barns (see B.3., [Unfriendly Environment]), Henry is driving through Fake Barn County and looks out of his car window and forms the belief that he’s seeing a barn. At this point, construction work on several structures a few miles away has been completed; they have been turned into façades. The construction crew hasn’t yet reached the barn that Henry passes, though, so his belief is true.

    Later that week, Henry passes the spot where he identified the barn again. He notices a construction crew packing up their gear. Out of curiosity, Henry gets out of the car and circles around the structure on foot. He realises that the barn has been reduced to a barn-façade as he watches the builders clear away the rest of the rubble from the demolished walls and roof. He forms the true belief that the structure is now not a barn. 