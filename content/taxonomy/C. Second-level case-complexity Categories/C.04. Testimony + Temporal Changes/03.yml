name: "Change of Basis for Belief: Successful Testimony Pre-empting Receiver’s Evidential Base"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises].

    At t~2~ p is true and S receives testimony that p by trustworthy and reliable attester R. Now S believes that p based on this [Successful Testimony], it pre-empts the basis for believing p S had at t~1~.
comments: 
  - "See [Change of Basis for Belief: Successful Testimony Widening Receiver’s Evidential Base]."
tokens:
