name: "Change of Basis for Belief & Doxastic Attitude: False or Misleading Testimony Convinces Receiver to Change Doxastic Attitude"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on

    - [Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises], or
    - [Successful Testimony] by attester R.

    At t~2~ p is true, but S abandons the belief that p and forms the belief that non-p based on

    - [False Testimony] by another attester T, or
    - [Unsuccessful Transmission] or [Testimony-Based False Implication] by attesters T or R.
comments: 
  - "Since S gains a false belief at t2 in tokens of this [type], I will presume it’s uncontroversial that S *lacks knowledge*."
tokens:
  - "Milk in the Fridge 19: After breakfast Anna puts a half empty milk carton in her fridge and (based on her accurate perception) believes there is now milk in the fridge. In the evening, she asks her flatmate whether there’s still milk in the fridge. He falsely attests that there isn’t, and Anna forms the false belief that there’s no milk in the fridge."