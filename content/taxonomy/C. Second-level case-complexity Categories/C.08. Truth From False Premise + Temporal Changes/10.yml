  - "Sheep 6: As in Chisholm’s (1966/1989) Sheep 1 (B.2., [Direct Gettier]), a person is overlooking a field, and there is a sheep in the field, which is hidden from the person’s view. Initially, the person thinks that there are no sheep in the field. Then, a very fleecy dog trots onto the field. The person mistakes the dog for a sheep and now believes that there is a sheep in the field."