name: "Change of Truth Value & Basis for Belief: Disappearing Truth-Maker – Gettier to Paradigmatic Lack of Knowledge"
descriptions:
  - |
    At t~1~ p is true, but S believes that p based on [False Premise Gettier], [Direct Gettier] or [Instrument Gettier].

    At t~2~ p is false, but S believes that p based on remembering the evidence S had at t~1~ alongside the false premise that nothing has interfered which might falsify p between t~1~ and t~2~.
comments: 
  - "Since S gains a false belief at t~2~ in tokens of this [type], I will presume it’s uncontroversial that S *lacks knowledge*."
tokens:
  - "Disappearing Zebra: As in Turri’s (2013) Zebra (see B.1., [Direct Gettier]), Zach mistakes the painted mule, which is in his office building’s lobby as part of a charity event, for a real zebra. His belief that there’s a zebra in the building is nonetheless true because a company that’s importing exotic animals temporarily keeps a zebra in the building before shipping it off to a buyer. An hour later, correctly assuming that the event is still running, Zach believes that there is still a zebra in the building. However, the real zebra was shipped off half an hour ago."