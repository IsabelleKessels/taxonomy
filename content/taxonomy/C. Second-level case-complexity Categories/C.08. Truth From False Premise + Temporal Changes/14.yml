name: "Change of Truth Value, Basis for Belief & Doxastic Attitude: Emerging Misleading Evidence and Backup Truth-Maker – Paradigmatic Knowledge to Gettiered"
descriptions:
  - |
    At t~1~ p is true and S believes p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives or remembers in the moment.

    At t~2~ p is false, but S believes non-p based on [False Premise Gettier], [Direct Gettier] or [Instrument Gettier].
