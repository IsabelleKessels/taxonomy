name: "Change of Basis for Belief: Unnoticed Removal of Misleading Evidence – Gettiered to Gettiered"
descriptions:
  - |
    At t~1~ p is true, but S believes that p based on [False Premise Gettier], [Direct Gettier] or [Instrument Gettier]
    At t~2~ p is true, but S believes that p based a different instance of [False Premise Gettier], [Direct Gettier] or [Instrument Gettier] than at t~1~.

    Unknown to S, the misleading evidence which initially gettiered S was removed from the environment between t~1~ and t~2~.
comments: 
  - "Turri et al. (2015) investigated Dimond Thief 3 in their x-phi study and report knowledge-attributions at a rate of 19%, i.e., a tendency to ascribe lack of knowledge (368). This experiment had a large sample size of n = 813, split across seven conditions with 85 participants excluded after failing comprehension tasks (384)."
  - |
    I hold that Cory’s basis of believing in Piggy Bank 2 changes between t~1~ and t~2~: At t~1~ he is gettiered through misperceiving the date stated on the 1938 coin. At t~2~ he’s gettiered through reasoning from the two false premises that he put a 1938 coin into his piggy bank earlier that day and that no one interfered with it since.

    Starmans and Friedman (2012) investigated Piggy Bank 2 in their x-phi study; which only reports aggregated data for Piggy Bank 2 and Dairy Swab 2 (subsumed under [Change of Truth Value & Basis for Belief: Emerging Truth-Maker – Paradigmatic Lack of Knowledge to Gettiered]). Under the label ‘apparent evidence’, they contrast this aggregated data with that of Piggy Bank 1 (subsumed under [Change of Basis for Belief: Persistent Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]) and Dairy Swab 1 (subsumed under [Change of Basis for Belief: Emerging Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]), which they label ‘authentic evidence.’

    Starmans & Friedman (2012) state that “knowledge was attributed at less than chance rates in the Apparent Evidence condition” (279). I don’t place much weight on these results, because they conflate data on what appear to be tokens of two distinct [types]. Moreover, it is stated that results differed somewhat when only considering ‘the first story’ (279). It is, however, unclear whether this refers to the Dairy Swab or Piggy Bank storyline: In Starmans & Friedman’s (2012) appendix, Dairy Swab is listed first, making one assume that this is story 1; however, in the main text, Piggy Bank is mentioned first. Another reason I am concerned about the validity of their results is the small sample size of n = 43, split across four possible conditions (each participant read two stories, with combinations of Dairy Swab storyline vs. Piggy Bank storyline and authentic vs. apparent evidence condition), with 7 participants excluded after failing comprehension tasks (278).
tokens:
  - "Turri et al. (2015) Dimond Thief 3: “Emma is admiring jewelry in a fancy department store. She is particularly fascinated by the stones in the diamond display. After discussing it with the sales associate, she selects a stone, pays for it, and puts it in her pocket. After browsing for another minute, Emma leaves the store. ¶ Unfortunately, the stone Emma bought is a fake. It’s not a real diamond. It’s a worthless cubic zirconium. ¶ While Emma was browsing, she didn’t notice that a stealthy pickpocket tried to reach into her pocket and steal the fake stone she just bought. The pickpocket succeeded. ¶ The coat Emma is wearing used to belong to her grandmother. A long time ago, in order to keep it safe during a time of crisis, the grandmother stitched a diamond deep in the pocket of the coat, directly underneath a button, so no one would detect it. The grandmother died before she could tell anyone about what she did. And no one, not even Emma, has noticed the diamond in the pocket ever since.” (Suppl.)"
  - "Starmans and Friedman’s (2012) Piggy Bank 2: “Corey has been collecting coins in his piggy bank for years. One day he is about to put a quarter in his piggy bank, and notices that it looks pretty old. Though he’s never paid attention to dates before, he reads the date and sees that it’s from 1936. However, he doesn’t realize that the date has partially rubbed off and it is really from 1938. There is already a quarter dated 1936 buried deep in his piggy bank, but Corey isn’t aware of this. He deposits the quarter and goes to take a nap. Corey’s roommate Scott comes home, and needs some change for the bus. He shakes the piggy bank and the quarter Corey just put in falls out. Scott takes it and leaves. Corey wakes up after a 10-minute nap, and doesn’t realize that Scott was there.” (282f.) Here, we’re interested in whether Cory knows that there is a coin from 1936 in his piggy bank."