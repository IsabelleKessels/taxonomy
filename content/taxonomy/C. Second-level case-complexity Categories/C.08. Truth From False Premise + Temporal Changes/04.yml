name: "[Change of Basis for Belief: Debunked Misleading Evidence – Gettiered to Paradigmatic Knowledge] "
descriptions:
  - |
    At t~1~ p is true, but S believes that p based on [False Premise Gettier], [Direct Gettier] or [Instrument Gettier].

    At t~2~ p is true and S realises that one of the (explicit or implicit) premises S based the belief on at t~1~ is in fact mistaken. Now S believes that p based on Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises].
comments: []
tokens:
  - "Sheep 3: As in Chisholm’s (1966/1989) Sheep 1 (see B.2., [Direct Gettier]), a person, let’s call her Alex, “*takes* there to be a sheep in the field and does so under conditions which are such that, when under those conditions a person takes there to be a sheep in the field, then it is *evident* for that person that there is a sheep in the field. The person [Alex; IK], however, has mistaken a dog for a sheep and so what [s]he sees is not a sheep at all. Nevertheless it happens that there *is* a sheep in another part of the field.” (93.) In this version, Alex sits down on a bench and observes the scenery for a while. After a few minutes, she notices a creature appearing from behind some bushes. It’s the sheep that was hidden away. The creature Alex mistook for a sheep a few minutes ago starts barking and runs to the creature that appeared from behind the bushes. Alex realises that she mistook a dog for a sheep, but that her belief that a sheep is in the field was true nonetheless. She retains the belief that a sheep is in the field."