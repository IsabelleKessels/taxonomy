tokens:
  - |
    Ford Barcelona Rejected 2: As in Gettier’s (1963) Ford Barcelona (B.2., [False Premise Gettier]), Smith gets a lift from Jones in a Ford. He forms the true belief ‘Either Jones owns a Ford, or Brown is in Boston’, which he bases on the false premise that Jones owns the Ford. He has no indication of Brown’s whereabouts and chose Boston at random. As it so happens, Brown is in Boston at the time, so Smith’s belief is true.
    
    A couple of days later, Jones gives Smith a ride in the Ford again. They both have to attend an event in Washington, and Jones offered to drive. Waiting at a red light, they spot Brown walking on the pavement. Just a moment later, Smith notices a sticker on the dashboard, which states the name and contact details of a car rental service. Smith realises that the Ford must be a rental and that Jones probably doesn’t own it. He has also just seen Brown in Washington. Smith thus changes his mind and comes to believe it’s not the case that either Jones owns a Ford, or Brown is in Boston.