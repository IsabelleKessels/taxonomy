name: "Change of Truth Value, Basis for Belief & Doxastic Attitude: Gettiered to Lack of Paradigmatic Knowledge"
descriptions:
  - |
    At t~1~ p is true, but S believes p based on [False Premise Gettier], [Direct Gettier] or [Instrument Gettier].

    At t~2~ p is false, but S believes non-p based on [Unsuitable Reason].
comments: []
tokens:
  - "Sheep 8: As in Chisholm’s (1966/1989) Sheep 1 (see B.2., [Direct Gettier]), a person, let’s call her Alex, “*takes* there to be a sheep in the field and does so under conditions which are such that, when under those conditions a person takes there to be a sheep in the field, then it is *evident* for that person that there is a sheep in the field. The person [Alex; IK], however, has mistaken a dog for a sheep and so what [s]he sees is not a sheep at all. Nevertheless it happens that there *is* a sheep in another part of the field.” (93.) Alex continues her hike. About an hour later, she reads a sign saying that a wolf has been frequenting this area, including the fields. She thinks back to the field and, worried that the sheep might get caught by the wolf, forms the belief that there are no sheep in the field now (say, because a shepherd has led it into the stables) based on wishful thinking. As it so happens, there are no sheep in the field at that moment. The sheep that was in the field earlier has moved along to the nearby forest."