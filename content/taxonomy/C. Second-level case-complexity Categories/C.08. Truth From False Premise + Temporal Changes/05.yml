name: "Change of Basis for Belief: Persistent Backup Truth-Maker – Paradigmatic Knowledge to Gettiered"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises].

    At t~2~ p is true, but S believes that p based on remembering the evidence S had at t~1~ alongside the false premise that nothing has interfered which might falsify p between t~1~ and t~2~. As it so happens, the matter of fact which makes p true at t~1~ changed. However, a different matter of fact, also rendering p true (a ‘backup truth-maker’), applies both at t~1~ and t~2~. Thus, S’s belief that p remains true throughout the whole timespan.
comments: 
  - |
    Turri et al. (2015) investigated Wandering Squirrel 2 in their x-phi study and report that only 42% of participants attributed knowledge, but that “[c]ases involving dissimilar replacements are still viewed as being importantly different from paradigmatic cases of ignorance” (384). Turri et al. report a rate of knowledge-ascription of 39 % in Dimond Thief 2 (386). Their study compared the case with Wandering Squirrel 1 and Dimond Thief 1 (tokens of [Change of Basis for Belief: Emerging Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]) and focussed on whether the backup truth-maker is similar or dissimilar to the original evidence. The experiment involving Wandering Squirrel 2 had a large sample size of n = 576, split across three conditions with 18 participants excluded after failing comprehension tasks and 6 participants excluded for having partaken in previous studies (383); the one including Dimond Thief 2 had a large sample size of n = 813 split across seven conditions with 85 participants excluded after failing comprehension tasks (384).

    In the formulation of Wandering Squirrel 2, it is not exactly clear, whether the binoculars are central to Darrel seeing the squirrel – I assume they are not. If they were, the belief at t~1~ would count as based on [Sensory Help] and the case would need to be grouped with a third-level complexity {{< sc >}}Category{{< /sc >}} which additionally involves {{< sc >}}Help or Hindrance{{< /sc >}}. 
  - |
    Starmans and Friedman (2012) investigated Piggy Bank 1 in their x-phi study; which only reports aggregated data for Piggy Bank 1 and Dairy Swab 1 (subsumed under [Change of Basis for Belief: Emerging Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]). Under the label ‘authentic evidence’, the authors contrast this aggregated data with that of Piggy Bank 2 (subsumed under [Change of Basis for Belief: Unnoticed Removal of Misleading Evidence – Gettiered to Gettiered]) and Dairy Swab 2 (subsumed under [Change of Truth Value & Basis for Belief: Emerging Truth-Maker – Paradigmatic Lack of Knowledge to Gettiered]), which they label ‘apparent evidence.’
    
    They state that “participants attributed knowledge more in the Authentic Evidence condition (67%)” (279). I don’t place much weight on these results, because they conflate data on what appear to be tokens of two distinct [types]. Moreover, they state that results differed somewhat when only considering ‘the first story’ (279). It is, however, unclear whether this refers to the Dairy Swab or Piggy Bank storyline: In Starmans & Friedman’s (2012) appendix, Dairy Swab is listed first, making one assume that this is story 1; however, in the main text, Piggy Bank is mentioned first. Another reason I am concerned about the validity of their results is the small sample size of n = 43, split across four possible conditions (each participant read two stories, with combinations of Dairy Swab storyline vs. Piggy Bank storyline and authentic vs. apparent evidence condition), with 7 participants excluded after failing comprehension tasks (278 ).
  - "Turri (2013) investigated Hidden Coin in his x-phi study and reports “participants in Authentic Gettier overwhelmingly said that Robert ‘only thinks he knows’ (89%, binomial, *p* < 0.001, one-tailed)” (6). His experiment uses a very small sample size of n = 52 split across two conditions, i.e., only around 25 participants per condition. Further research is required to test the validity of his results."
tokens:
  - "Turri et al.’s (2015) Wandering Squirrel 2: “Darrel is an ecologist collecting data on red speckled ground squirrels in Canyon Falls national park. The park is divided into ten zones and today Darrel is working in Zone 3. ¶ While scanning the river valley with his binoculars, Darrel sees a bushy-tailed creature with distinctive red markings on its chest and belly. The red speckled ground squirrel is the only native species with such markings. Soon Darrel packs up his gear and hikes back to base camp. ¶ When Darrel returns to camp, his colleague says, ‘A reporter is going to do a story on local wildlife and she needs some video footage of a red speckled ground squirrel. Are there any in Zone 3?’ Darrel replies, ‘Yes, there is at least one red speckled ground squirrel in Zone 3.’ […] The animal Darrel saw in the river valley is a female red speckled ground squirrel, recently photographed by campers. But while Darrel was hiking back to camp, the female he saw migrated out of Zone 3 and never returned. However, a male squirrel, which Darrel never saw, is hibernating in a deep burrow all the way on the other side of Zone 3, so no one would detect it. So there is a red speckled ground squirrel in Zone 3 after all.” (Suppl.)"
  - "Turri et al.’s (2015) Dimond Thief 2: “Emma is admiring jewelry in a fancy department store. She is particularly fascinated by the stones in the diamond display. After discussing it with the sales associate, she selects a diamond, pays for it, and puts it in her coat pocket. After browsing for another minute, Emma leaves the store. ¶ While Emma was browsing, she didn't notice that a stealthy pickpocket tried to reach into her pocket and steal the diamond she just bought. The pickpocket succeeded. ¶ The coat Emma is wearing used to belong to her grandmother. A long time ago, in order to keep it safe during a time of crisis, the grandmother stitched a diamond deep in the pocket of the coat, directly underneath a button, so no one would detect it. The grandmother died before she could tell anyone about what she did. And no one, not even Emma, has noticed the diamond in the pocket ever since.” (Suppl.)"
  - "Starmans and Friedman’s (2012) Piggy Bank 1 “Corey has been collecting coins in his piggy bank for years. One day he is about to put a quarter in his piggy bank, and notices that it looks pretty old. Though he’s never paid attention to dates before, he reads the date and sees that it’s from 1936. However, he doesn’t realize that 1936 is the year his grandmother was born. There is already a quarter dated 1936 buried deep in his piggy bank, but Corey isn’t aware of this. He deposits the quarter and goes to take a nap. Corey’s roommate Scott comes home, and needs some change for the bus. He shakes the piggy bank and the quarter Corey just put in falls out. Scott takes it and leaves. Corey wakes up after a 10 minute nap, and doesn’t realize that Scott was there.” (282.) Here, we’re interested in whether Cory knows that there is a coin from 1936 in his piggy bank."
  - |
    Turri’s (2013) Hidden Coin: “Robert recently made a purchase for a rare 1804 US silver dollar. He keeps the coin on display over the fireplace in his library. This evening Robert is having his neighbors over for dinner. He puts the coin in its display over the fireplace, shuts the library doors behind him, and hurries to greet his guests, who just arrived. He greets them and says, ‘Guess what? There is an 1804 US silver dollar in my library.’

    […] When Robert shut the library doors, a coin thief silently entered through the library window, stole Robert’s 1804 US silver dollar, and quickly escaped. Robert had only been out of the library for a few seconds and did not hear anything. The coin was already gone by the time Robert greets his guests and tells them, ‘There is an 1804 US silver dollar in my library.’

    […] Robert’s house is a very old mansion. Back in the early 1800s, when the house was originally built, one of the carpenters accidentally, and without noticing, dropped an 1804 US silver dollar into the mortar mix used to make the fireplace. This lost silver dollar is still in the fireplace in the library. But no one has seen it for hundreds of years, and no one will ever see it again. It will remain hidden in Robert’s library.” (5.) Here, we’re interested in whether Robert knows that there is a US silver dollar in his library.