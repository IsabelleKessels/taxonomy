name: "Change of Truth Value, Basis for Belief & Doxastic Attitude: Reliable Instrument Calibrated to Gettier"
descriptions:
  - |
    At t~1~ p~1~ is true, but S believes p~1~ based on [Instrument Gettier] involving instrument I~1~. Based on this, S calibrates another (otherwise reliable) instrument I~2~.

    At t~2~ p~n~ is true and I~2~ indicates that p~n~. S believes that p~n~ based on consulting I~2~.
comments: 
  - "In order to fit the [case-type] into the overview table in the {{< sc >}}Category{{< /sc >}}’s introduction, I assume that the change from p~1~ to p~n~ represents a change in truth value. Nothing depends on this choice; classifying this as *Change of Exact Proposition Believed, Basis for Belief & Doxastic Attitude* would be perfectly acceptable."
  - "Hawthorne (2000) intuits about Set Watch 1: “Someone asks you whether I know that the party begins in half an hour. You are fully apprised of the gettierized etiology of the relevant temporal beliefs. What do you say? Once again, nearly everyone has a strong pull in this context to say ‘Yes’ and thus to concede that in this case we have gettierized belief that counts as knowledge.” (203.)"
  - "Baumann (2016) doesn’t state his own intuition about Set Watch 2, he merely comments: “Whoever denies knowledge in the original case will also tend to deny it in [Set Watch 2.]” (69.) He comments about Set Watch 3: “I still suspect that many people would attribute knowledge[.]” (71.)"
tokens:
  - "Hawthorne’s (2000) Set Watch 1: “A clock is stopped and reads ‘7 P.M.’ At 7 P.M., thinking that the clock is working, I set my watch by that clock. My watch now accurately reflects the time, though of course there is no pathway of the sort required by causal theorists from the fact to the reading. Much later that day (without having a chance to check my watch against other clocks in the interim), I look at my watch, see that it reads ‘10 P.M.’ and think to myself ‘It’s 10 P.M.; The party begins at 10:30, so it’s time to leave for the party.’” (203.)"
  - "Baumann’s (2016) Set Watch 2: “A wants to know what time it is, looks at a clock which indicates the correct time, say 12:15, and thus comes to believe that it is 12:15. Unbeknownst to A, however, the clock has stopped some time ago and, as a matter of sheer accidence, just happened to indicate the correct time when A consulted it. […] A’s watch has also stopped (though at a different time). After consulting the clock, A immediately sets her watch which from now on indicates the correct time. Two minutes later, A consults her watch and comes to believe (correctly, again) that it is 12:17.” (68f.)"
  - "Baumann’s (2016) Set Watch 3: The initial set-up is the same as in Set Watch 2, apart from that A doesn’t look at the watch immediately: “A’s watch is an exquisite and expensive Swiss watch. It is the kind of watch which need not be set for decades after the first correct setting. A does not wear it but keeps it, for safety reasons, in a drawer. The watch is very dear to her because it was a wedding gift. Quite often she takes it out of the drawer to show it to guests. Whenever she does that, she looks at it but curiously never consults it for the time. She admires the beauty of the watch so much that it never occurs to her to use it for such prosaic purposes. At this moment, one year after the clock incident, she takes the watch out again and looks at it. She wonders what time it is and for the first time consults it for the time. The watch shows the correct time: 1:19 p.m. This kind of watch, she was told, is super-reliable and she has no reason to doubt it. Neither A nor anyone else has any clue that the watch was set after a ‘Russellian’ clock, exactly one year ago. A has no doubt and truly comes to believe that it is 1:19 p.m. now.” (71.)"