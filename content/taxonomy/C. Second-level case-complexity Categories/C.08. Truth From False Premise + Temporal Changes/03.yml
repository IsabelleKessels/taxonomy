name: "Change of Basis for Belief: Emerging Backup Truth-Maker – Paradigmatic Knowledge to Gettiered"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises].

    At t~2~ p is true, but S believes that p based on remembering the evidence S had at t~1~ alongside the false premise that nothing has interfered which might falsify p between t~1~ and t~2~. As it so happens, the matter of fact which makes p true at t~1~ changes to a different situation which also renders p true (a ‘backup truth-maker’) between t~1~ and t~2~.

    Thus, S’s belief that p briefly turns false between t~1~ and t~2~, but is true at both points in time that are explicitly considered, albeit for different reasons.´
comments: 
  - |
    Turri et al. (2015) investigated Wandering Squirrel 1 in two experiments of their x-phi study. In the former “[m]ost participants […] attributed knowledge [66%; IK], even though the belief was ultimately true because of the backup truth-maker” (383). The latter experiment was high-powered, and the results differ somewhat: “Knowledge attribution in […] [Wandering Squirrel 1; IK] did not differ from chance, binomial p = .249, and it was lower than the rate of knowledge attribution in the Replacement condition from Experiment 2, binomial p = .002, test proportion = .66.” (384.) They furthermore report on Dimond Thief 1: “[K]nowledge attribution in Detect Similar (55 %) [Dimond Thief 1; IK] was […] nonsignificantly above chance, binomial p = .195[.]” (386.) 
    
    Turri et al.’s (2015) former experiment, involving Wandering Squirrel 1, had a relatively small sample size of n = 141 split across three conditions with 6 participants excluded after failing comprehension tasks and 3 participants excluded for having partaken in previous studies (382); the latter had a sample size of n = 576 split across three conditions with 18 participants excluded after failing comprehension tasks and 6 participants excluded for having partaken in previous studies (383). The one including Dimond Thief 1 had a sample size of n = 813 split across seven conditions with 85 participants excluded after failing comprehension tasks (384).
    
    In the formulation of Wandering Squirrel 1, it is not exactly clear, whether the binoculars are central to Darrel seeing the squirrel – I assume they are not. If they were, the belief at t~1~ would count as based on [Sensory Help] and the case would need to be grouped with a third-level complexity {{< sc >}}Category{{< /sc >}} which additionally involves {{< sc >}}Help or Hindrance{{< /sc >}}.
  - "Starmans and Friedman (2012) investigated Pen Burglar in their x-phi study and report that “[p]articipants […] attributed knowledge at rates exceeding chance” (276). Comparing Pen Burglar to a slightly adapted vignette, where the pen is stolen and replaced by the same burglar, they report: “[W]hen only examining responses to the dichotomous knowledge question participants were equally likely to attribute knowledge in the 1-Thief (72%) and 2-Thief Gettier conditions (69%, Fisher’s, p = 1.0, see Fig. 2).” (276.) Their experiment had a small sample size of n = 133 split across four conditions, with 35 participants excluded after failing comprehension tasks (276). Further research is required to test the validity of their results."
  - |   
    Starmans and Friedman (2012) also investigated Dairy Swab 1. Their study only reports aggregated data for Dairy Swab 1 and Piggy Bank 1 (subsumed under [Change of Basis for Belief: Persistent Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]). Under the label ‘authentic evidence’, the authors contrast this aggregated data with that of Piggy Bank 2 (subsumed under [Change of Basis for Belief: Unnoticed Removal of Misleading Evidence – Gettiered to Gettiered]) and Dairy Swab 2 (subsumed under [Change of Truth Value & Basis for Belief: Emerging Truth-Maker – Paradigmatic Lack of Knowledge to Gettiered]), which they label ‘apparent evidence.’ 

    Starmans & Friedman (2012) state that “participants attributed knowledge more in the Authentic Evidence condition (67%)” (279). I don’t place much weight on these results, because they conflate data on what appear to be tokens of two distinct [types]. Moreover, they state that results differed somewhat when only considering ‘the first story’ (279): They report knowledge attributions of 67% for the aggregate date, whereas “76% of participants attributed knowledge” (279) when considering this story in isolation. It is, however, unclear whether this refers to the Dairy Swab or Piggy Bank storyline: In Starmans & Friedman’s (2012) appendix, Dairy Swab is listed first, making one assume that this is story 1; however, in the main text, Piggy Bank is mentioned first. Another reason I am concerned about the validity of their results is the small sample size of n = 43, split across four possible conditions (each participant read two stories, with combinations of Dairy Swab storyline vs. Piggy Bank storyline and authentic vs. apparent evidence condition), with 7 participants excluded after failing comprehension tasks (278).
  - "Turri (2013) conducted several experiments to test his hypothesis that cases of this [type] evoke a lack of knowledge evaluation when they are presented in stages – i.e., when vignettes are split into parts and presented separately – and participants asked to evaluate whether the agent knows at each stage. He reports on Vibration Pen that, if the case was presented as a whole “the knowledge ascription rate […] didn’t differ significantly from chance (48%, binomial, p = 1) and was actually lower than I expected” whereas when the case was presented in stages “knowledge ascription […] occurred at rates significantly less than chance (29%, binomial, *p* = 0.018)” (13). His experiments use a very small sample size of around 25-30 participants per condition. Further research is required to test the validity of his results."
tokens:
  - "Turri et al.’s Wandering Squirrel 1 (2015): “Darrel is an ecologist collecting data on red speckled ground squirrels in Canyon Falls national park. The park is divided into ten zones and today Darrel is working in Zone 3. ¶ While scanning the river valley with his binoculars, Darrel sees a bushy-tailed creature with distinctive red markings on its chest and belly. The red speckled ground squirrel is the only native species with such markings. Soon Darrel packs up his gear and hikes back to base camp. ¶ When Darrel returns to camp, his colleague says, ‘A reporter is going to do a story on local wildlife and she needs some video footage of a red speckled ground squirrel. Are there any in Zone 3?’ Darrel replies, ‘Yes, there is at least one red speckled ground squirrel in Zone 3.’ […] The animal Darrel saw in the river valley is a female red speckled ground squirrel, recently photographed by campers. However, while Darrel was hiking back to camp, the female he saw migrated out of Zone 3 and never returned. At almost the same time, a different female, which Darrel never saw, migrated into Zone 3 and made her nest in the river valley. So there is a red speckled ground squirrel in Zone 3 after all.” (Suppl.)"
  - "Turri et al.’s (2015) Dimond Thief 1: “Emma is admiring jewelry in a fancy department store. She is particularly fascinated by the stones in the diamond display. After discussing it with the sales associate, she selects a diamond, pays for it, and puts it in her coat pocket. After browsing for another minute, Emma leaves the store. ¶ While Emma was browsing, she didn't notice that a stealthy pickpocket tried to reach into her pocket and steal the diamond she just bought. The pickpocket succeeded. ¶ Afterward, the pickpocket felt very guilty about what he had done. So before Emma left the store, he slipped the diamond back into Emma’s pocket. No one, not Even Emma, noticed that he did this.” (Suppl.) They additionally used this adapted vignette: “[…] Another thing happened while Emma was browsing. Her disguised ex-husband was also in the store. In order to frame Emma for robbery, he stealthily slipped a stolen diamond into Emma's pocket. No one, not even Emma, noticed that this happened.” (Suppl.)"
  - "Starmans and Friedman’s (2012) Pen Burglar “Katie is in her locked apartment writing a letter. She puts the letter and her blue Bic pen down on her coffee table. Then she goes into the bathroom to take a shower. As Katie’s shower begins, two burglars silently break into the apartment. One burglar takes Katie’s blue Bic pen from the table. But the other burglar absentmindedly leaves his own identical blue Bic pen […] on the coffee table. Then the burglars leave. Katie is still in the shower, and did not hear anything.” (276.) Here, we’re interested in whether Katie knows that there is a pen on her desk."
  - |
    Starmans and Friedman’s (2012) Dairy Swab 1: “Julie buys a container of yogurt at the local deli. Although, Julie is not aware of it, the yogurt in the container is exceptionally sweet—a mixup at the factory caused the yogurt to get a triple dose of sweetener. Julie comes home, puts it her fridge, and then goes into her bedroom. Julie’s neighbor Sam has been spying on her. While she is in her bedroom, he picks the lock to her apartment, and enters.

    He takes the yogurt container from the fridge, and replaces it with a sealed container of yogurt from his own fridge. Then he goes back into his own apartment with Julie’s yogurt container. Julie has only been in the bedroom for a few minutes, and did not hear anything.” (282.) Here, we’re interested in whether Julie knows that there is a container of yogurt in her fridge.
  - "Turri’s (2013) Vibration Pen: “Grace is alone in the living room of her locked apartment, writing a letter with a blue Bic pen. She puts the letter and the blue Bic pen down on her coffee table and goes into the bathroom to take a quick shower. While she is in the shower, the apartment remains locked and nobody enters. […] Just as Grace began her shower, several construction vehicles drove by her apartment building. Because Grace was in the shower, she didn’t notice the traffic. […] But the vibrations from the construction traffic caused […] two things to happen […]. […] First, […] [t]he vibrations caused the blue Bic pen, which she had set down, to shift position, fall off the coffee table, and land on the floor. Because Grace was still in the shower, she didn’t notice that this happened. […] Second, […] [f]or a very long time, there has been a blue Bic pen hidden in the light fixture in Grace’s living room, right above the coffee table. No one, not even Grace, has ever noticed this hidden pen. The vibrations caused this hidden blue Bic pen to fall down and land on the coffee table. Because Grace was still in the shower, she did not notice that this happened.” (12.) Here, we’re interested in whether Grace knows that there is a pen on her desk."