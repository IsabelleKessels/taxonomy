name: "Change of Truth Value & Basis for Belief: Emerging Truth-Maker – Paradigmatic Lack of Knowledge to Gettiered"
descriptions:
  - |
    At t~1~ p is false, but S believes that p based on [Misperception] and/or [False Reasoning] relating to what S perceives or remembers in the moment.

    At t~2~ p is true, because, as it so happens, an interference changed p’s truth value. S believes that p based on inference from the false premises that p was true (at t~1~) and that nothing changed p’s truth value in the interim.
comments:
  - "Heller (1999) is a contextualist about knowledge, but intuits about Leftovers as follows: “We use the word ‘knowledge’ to indicate her [his wife’s; IK] superior epistemic condition. The property we care about is one that I lack and she has.” (118f.)"
  - |
    Turri et al. (2015) investigated Wandering Squirrel 3 in their x-phi study and report that it “was overwhelmingly viewed as a case of ignorance” (382) with only 23% judging that Darrel ‘knows’ rather than ‘just believes.’ For Dimond Thief 3 they report knowledge-ascriptions of 39% (386). For the experiment including Dimond Thief 3, they had a large sample size of n = 813, split across seven conditions with 85 participants excluded after failing comprehension tasks (384). For the one including Wandering Squirrel 3, the sample size was relatively small: n = 141 split across three conditions with 6 participants excluded after failing comprehension tasks and 3 excluded for having partaken in previous studies (382).

    In the formulation of Wandering Squirrel 3, it is not exactly clear, whether the binoculars are central to Darrel seeing the squirrel – I assume they are not. If they were, the belief at t~1~ would count as based on [Insufficient Sensory Help] and the case would need to be grouped with a third-level complexity {{< sc >}}Category{{< /sc >}} which additionally involves {{< sc >}}Help or Hindrance{{< /sc >}}.
  - |
    Starmans and Friedman (2012) investigated Dairy Swab 2 in their x-phi study; which only reports aggregated data for Dairy Swab 2 and Piggy Bank 2 (subsumed under [Change of Basis for Belief: Unnoticed Removal of Misleading Evidence – Gettiered to Gettiered]). Under the label ‘apparent evidence’, the authors contrast this aggregated data with that of Piggy Bank 1 (subsumed under [Change of Basis for Belief: Persistent Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]) and Dairy Swab 1 (subsumed under [Change of Basis for Belief: Emerging Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]), which they label ‘authentic evidence.’

    Starmans and Friedman (2012) state that “knowledge was attributed at less than chance rates in the Apparent Evidence condition” (279). I don’t place much weight on these results, because they conflate data on what appear to be tokens of two distinct [types]. Moreover, they state that results differed somewhat when only considering ‘the first story’ (279). They report knowledge attributions of 30% for the aggregate data, whereas “only 14% attributed knowledge in the Apparent Evidence condition” (279) when considering this story in isolation. It is, however, unclear whether this refers to the Dairy Swab or Piggy Bank storyline: In Starmans & Friedman’s (2012) appendix, Dairy Swab is listed first, making one assume that this is story 1; however, in the main text, Piggy Bank is mentioned first. Another reason I am concerned about the validity of their results is the small sample size of n = 43, split across four conditions (Dairy Swab storyline vs. Piggy Bank storyline; authentic vs. apparent evidence condition), with 7 participants excluded after failing comprehension tasks (278).

tokens:
  - "Heller’s (1999) Leftovers: “[W]hen I put away the leftovers last night I wrapped them with plastic wrap, and then I unthinkingly put the plastic wrap in the refrigerator and the leftovers in the drawer. My wife found the wrap in the refrigerator, figured out what happened, and moved the wrap to the drawer and the leftovers to the refrigerator. Today we both believe that the leftovers are in the refrigerator, but her belief is better connected to the truth than mine.” (118.)"
  - "Turri et al.’s (2015) Wandering Squirrel 3: “Darrel is an ecologist collecting data on red speckled ground squirrels in Canyon Falls national park. The park is divided into ten zones and today Darrel is working in Zone 3. ¶ While scanning the river valley with his binoculars, Darrel sees a bushy-tailed creature with distinctive red markings on its chest and belly. The red speckled ground squirrel is the only native species with such markings. Soon Darrel packs up his gear and hikes back to base camp. ¶ When Darrel returns to camp, his colleague says, ‘A reporter is going to do a story on local wildlife and she needs some video footage of a red speckled ground squirrel. Are there any in Zone 3?’ Darrel replies, ‘Yes, there is at least one red speckled ground squirrel in Zone 3.’ […] The animal Darrel saw in the river valley is actually a non-native prairie dog, recently abandoned by campers. However, while Darrel was hiking back to camp, that prairie dog migrated out of Zone 3 and never returned. At almost the same time, a red speckled ground squirrel, which Darrel never saw, migrated into Zone 3 and made its nest near the river. So there is a red speckled ground squirrel in Zone 3 after all.” (Suppl.)"
  - "Turri et al.’s (2015) Dimond Thief 3: “Emma is admiring jewelry in a fancy department store. She is particularly fascinated by the stones in the diamond display. After discussing it with the sales associate, she selects a diamond, pays for it, and puts it in her coat pocket. After browsing for another minute, Emma leaves the store. ¶ While Emma was browsing, she didn't notice that a stealthy pickpocket tried to reach into her pocket and steal the diamond she just bought. The pickpocket succeeded. ¶ The coat Emma is wearing used to belong to her grandmother. A long time ago, in order to keep it safe during a time of crisis, the grandmother stitched a diamond deep in the pocket of the coat, directly underneath a button, so no one would detect it. The grandmother died before she could tell anyone about what she did. And no one, not even Emma, has noticed the diamond in the pocket ever since.” (Suppl.) They additionally used this adapted vignette: “Another thing happened while Emma was browsing. Her disguised ex-husband was also in the store. In order to frame Emma for robbery, he stealthily slipped a stolen diamond into Emma's pocket. No one, not even Emma, noticed that this happened.” (Suppl.)"
  - "Starmans and Friedman’s (2012) Dairy Swab 2: “Julie buys a container of yogurt at the local deli. Although, Julie is not aware of it, there is no yogurt in the container – a mixup at the factory caused the container to be filled with sour cream instead. Julie comes home, puts it her fridge, and then goes into her bedroom. Julie’s neighbor Sam has been spying on her. While she is in her bedroom, he picks the lock to her apartment, and enters. He takes the yogurt container from the fridge, and replaces it with a sealed container of yogurt from his own fridge. Then he goes back into his own apartment with Julie’s yogurt container. Julie has only been in the bedroom for a few minutes, and did not hear anything.” (282.) Here, we’re interested in whether Julie knows that there is a container of yogurt in her fridge."
