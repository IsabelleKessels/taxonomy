tokens:
  - |
    Birdwatcher 10: Stefan is watching birds in the garden. He spots a small brown bird. Using binoculars to get a better look, he comes to believe that it’s a dunnock. The bird he has spotted is indeed a dunnock.

    In close possible worlds, the dunnock would also be in the garden, and Stefan would spot the small brown bird. The binoculars wouldn’t be available, because his wife would be using them to observe a rose-ringed parakeet. Without the binoculars, Stefan would misperceive the dunnock for a female house sparrow, thereby forming a false belief about what kind of bird it is.