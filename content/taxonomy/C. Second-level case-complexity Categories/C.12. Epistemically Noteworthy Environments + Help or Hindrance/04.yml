name: "Sensory Hindrance Turns Environment Unfriendly"
descriptions:
  - "Unknown to S, S is in an environment featuring slightly misleading evidence in regards to p~1~ (or p-type propositions). Given S’s normal perception, S would be able to differentiate the non-misleading from the misleading evidence. S would recognise the latter for what it is and wouldn’t form a false belief. However, some factor influences S’s sensory organs or perceptual process such that S’s perception is corrupted. If S were faced with the misleading evidence, this would lead to S forming a false belief about p~1~. By chance, S only encounters the non-misleading evidence. Despite the [Sensory Hindrance], S forms a belief that p~1~, which is true."
comments: []
tokens:
  - "Flea Market 7: Lars visits a flea market. He has a sight condition which entails high sensitivity to glaring light. It’s a bright summer’s day and Lars has been outdoors for a while already, so by now his vision is somewhat impaired by eye strain and pains. While looking through a stall’s merchandise he picks up a shirt, believing that it’s a shirt from a reputable brand. What Lars doesn’t realise is that the stall is selling blatant dupes of popular brands, which would be obvious forgeries to most customers. As it so happens, the shirt Lars picked up isn’t a dupe, but it only got into the retail space by accident. Had Lars picked up one of the dupes instead, due to the impact the light conditions have on his vision, he would have been fooled by it and believed it to be produced by the brand. In a different setting (e.g., at home, where he can control the light conditions), however, Lars would have identified it as a dupe as well."