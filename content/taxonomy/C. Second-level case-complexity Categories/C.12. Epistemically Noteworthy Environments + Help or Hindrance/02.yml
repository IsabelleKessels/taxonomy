tokens:
  - |
    Fake Barns Exposed: As in Goldman’s (1976) Fake Barns (see B.3., [Unfriendly Environment]), Henry is in Fake Barn County and looks out of his car window at the genuine barn. In this version, however, Henry has been administered a novel drug that increases cognitive processing and puts Henry in a state of high alertness to all his visual impressions. Looking at the barn, for example, he notices not only the shape of the structure, the colour of its doors, walls, roof etc., but also the shape of the shadow it casts in the afternoon sunlight. He forms the true belief that he’s looking at a barn. 

    Had Henry been looking at one of the barn-façades instead, he would have noticed the peculiar shape of that structure’s shadow (as it is a two-dimensional façade with some supporting beams rather than a building with walls and a roof). Since Henry would notice this, he would realise that something is amiss and not form the belief that he’s looking at a barn.