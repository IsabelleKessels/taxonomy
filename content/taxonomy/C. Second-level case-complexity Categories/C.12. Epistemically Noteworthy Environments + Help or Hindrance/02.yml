name: "Indirect Cognitive Help Exposes Unfriendly Environment"
descriptions:
  - "Some factor influences S’s cognitive states such that it increases S’s reliability when forming beliefs about whether p~1~ by perception, memory or reasoning (e.g., by making S more attentive / alert). Unknown to S, S is in an environment featuring misleading evidence in regards to p~1~ (or p-type propositions). By chance, S only encounters the non-misleading evidence and, based on this, forms the belief that p~1~, which is true. Given this evidence, S also would form this true belief that p~1~ if no [Indirect Cognitive Help] would be administered. If S were confronted with misleading evidence, the [Indirect Cognitive Help] would enable S to recognise this and prevent S from forming a false belief. "
