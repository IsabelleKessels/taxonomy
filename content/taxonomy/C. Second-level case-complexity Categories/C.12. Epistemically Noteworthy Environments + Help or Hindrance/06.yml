name: "Unknown Regularity Triggers Direct Cognitive Help"
descriptions:
  - |
    S is in an environment that features a regularity: whenever there is evidence for q~1~ (or another q-type proposition, q~n~), this (typically, or inevitably) means that p~1~ (or another p-type proposition, p~n~) is true. Moreover, whenever S forms the belief q~1~ (or a belief in q~n~), some factor intervenes and influences S’s normal belief-formation processes. It sets S into a state of believing that p~1~ (or p~n~), and this is true.

    S is unaware of this regularity. S forms the belief that q~1~ and then, based on the [Direct Cognitive Help] comes to believe that p~1~, which is true.
comments: []
tokens:
  - |
    Bug in a Box 1: Ludwig is unaware that he has entered an area where there is a peculiar regularity. All boxes in this area contain at least one bug (next to various other things). If one is aware of this regularity, seeing a box in this area is sufficient evidence to conclude that there’s a bug inside it.

    Moreover, the area is also haunted by a benevolent demon: It sets visitors into a state of believing “there’s a bug inside this” whenever they notice a box. Ludwig sees a box and suddenly finds himself believing “there’s a bug inside this.”