name: "Indirect Cognitive Hindrance Turns Environment Unfriendly"
descriptions:
  - "Unknown to S, S is in an environment featuring slightly misleading evidence in regards to p~1~ (or p-type propositions). Given S’s normal cognitive processes, S would be able to differentiate the non-misleading from the misleading evidence. S would recognise the latter for what it is and wouldn’t form a false belief. However, some factor influences S’s cognitive states such that it decreases S’s reliability when forming beliefs about whether p~1~ by perception, memory or reasoning (e.g., by making S less attentive / alert). If S were faced with the misleading evidence, this would lead to S forming a false belief about p~1~. By chance, S only encounters the non-misleading evidence. Despite the [Indirect Cognitive Hindrance], S forms the belief that p~1~, which is true."
comments: []
tokens:
  - "Flea Market 8: Lars visits a flea market. He dislikes crowds and, as the market is very busy, gets rather nervous and distracted. While looking through a stall’s merchandise he picks up a shirt, believing that it’s a shirt from a reputable brand. What Lars doesn’t realise is that the stall is selling blatant dupes of popular brands, which would be obvious forgeries to most customers. As it so happens, the shirt Lars picked up isn’t a dupe, but it only got into the retail space by accident. Had Lars picked up one of the dupes instead, due to his decreased attention, he would have been fooled by it and believed it to be produced by the brand. In a different setting, where he’d be more relaxed (e.g., in the comfort of his home), however, Lars would have identified it as a dupe as well. "