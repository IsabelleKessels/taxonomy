name: "Change of Truth Value & Basis for Belief: Paradigmatic Knowledge to Hindrance"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives or remembers in the moment. 

    At t~2~ p is false, but S believes that p based on [Direct Cognitive Hindrance], [Indirect Cognitive Hindrance] or [Sensory Hindrance].
comments: 
  - "Since S gains a false belief at t~2~ in tokens of this [type], I will presume it’s uncontroversial that S *lacks knowledge*."
tokens:
  - "Milk Demon 18: In the morning, Anna forms the true belief that there’s milk in the fridge, because she’s just put a half empty carton in there. Later that day, a malicious demon sets Anna into a state of believing that there’s milk in the fridge, which is, at that time, false."