name: "Change of Truth Value & Basis for Belief: Help to Paradigmatic Lack of Knowledge"
descriptions:
  - |
    At t~1~ p is true, but S believes that p based on [Direct Cognitive Help], [Indirect Cognitive Help] or [Sensory Help].

    At t~2~ p is false, but S believes that p based on [Misperception] and/or [False Reasoning] relating to what S perceives or remembers in the moment. 
comments:
  - "Since S gains a false belief at t~2~ in tokens of this [type], I will presume it’s uncontroversial that S *lacks knowledge*."
tokens:
  - "Milk Demon 20: In the morning, a benevolent demon sets Anna into a state of believing that there’s milk in the fridge, which is true. Later that day, Anna looks into the fridge and forms the false belief that there’s milk in there, because the milk carton she’s spotted is actually empty."