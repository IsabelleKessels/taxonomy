name: "Change of Truth Value, Basis for Belief & Doxastic Attitude: Help to Paradigmatic Knowledge"
descriptions:
  - |
    At t~1~ p is true, but S believes that p based on [Direct Cognitive Help], [Indirect Cognitive Help] or [Sensory Help].

    At t~2~ p is false and S believes that non-p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives or remembers in the moment. 
