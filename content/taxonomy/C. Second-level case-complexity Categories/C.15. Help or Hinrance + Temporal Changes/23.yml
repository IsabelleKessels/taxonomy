  - "Milk Demon 23: In the morning, a malicious demon sets Anna into a state of believing that there’s no milk in the fridge, which is false. Later that day, Anna forms the belief that there’s no milk in the fridge, based on a wild guess. As it so happens, this is, at that time, true."