name: "Change of Truth Value, Basis for Belief & Doxastic Attitude: Paradigmatic Knowledge to Help"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives or remembers in the moment. 

    At t~2~ p is false, but S believes that non-p based on a different instance of [Direct Cognitive Help], [Indirect Cognitive Help] or [Sensory Help] than at t~1~.
comments: []
tokens:
  - "Milk Demon 26: In the morning, Anna forms the true belief that there’s milk in the fridge, because she’s just put a half empty carton in there. Later that day, a benevolent demon sets Anna into a state of believing that there’s no milk in the fridge, which is, at that time, true."