name: "Change of Basis for Belief & Doxastic Attitude: Paradigmatic Lack of Knowledge to Hindrance"
descriptions:
  - |
    At t~1~ p is true, but S believes that p based on [Unsuitable Reason]. 

    At t~2~ p is true, but S believes that non-p based on [Direct Cognitive Hindrance], [Indirect Cognitive Hindrance] or [Sensory Hindrance].
comments:
  - "Since S gains a false belief at t~2~ in tokens of this [type], I will presume it’s uncontroversial that S *lacks knowledge*."
tokens:
  - "Milk Demon 11: In the morning, Anna forms the belief that there’s milk in the fridge based on wishful thinking. As it so happens, this is true. Later that day, a malicious demon sets Anna into a state of believing that there’s no milk in the fridge, which is false."