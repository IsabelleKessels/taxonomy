tokens:
  - "Milk Demon 24: In the morning, Anna forms the belief that there’s milk in the fridge based on wishful thinking. As it so happens, this is true. Later that day, a benevolent demon sets Anna into a state of believing that there’s no milk in the fridge, which is, at that time, true."