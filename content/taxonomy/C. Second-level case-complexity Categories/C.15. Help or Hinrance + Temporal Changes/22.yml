name: "Change of Truth Value & Basis for Belief: Hindrance to Paradigmatic Knowledge"
descriptions:
  - |
    At t~1~ p is true, but S believes that non-p based on [Direct Cognitive Hindrance], [Indirect Cognitive Hindrance] or [Sensory Hindrance].

    At t~2~ p is false and S believes that non-p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives or remembers in the moment.
comments: []
tokens:
  - "Milk Demon 22: In the morning, a malicious demon sets Anna into a state of believing that there’s no milk in the fridge, which is false. Later that day, Anna forms the true belief that there’s no milk in the fridge, because she’s just emptied the carton."