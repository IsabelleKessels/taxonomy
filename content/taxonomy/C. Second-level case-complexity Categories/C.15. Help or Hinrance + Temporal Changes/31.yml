name: "Change of Truth Value, Basis for Belief & Doxastic Attitude: Paradigmatic Lack of Knowledge to Hindrance"
descriptions:
  - |
    At t~1~ p is true, but S believes that non-p based on [Misperception] and/or [False Reasoning] relating to what S perceives or remembers in the moment. 

    At t~2~ p is false, but S believes that p based on [Direct Cognitive Hindrance], [Indirect Cognitive Hindrance] or [Sensory Hindrance].
comments:
  - "Since S gains a false belief at t~2~ in tokens of this [type], I will presume it’s uncontroversial that S *lacks knowledge*."
tokens:
  - "Milk Demon 31: In the morning, Anna looks into the fridge and forms the false belief that there’s no milk there, because the carton is hidden from her view behind other containers. Later that day, a malicious demon sets Anna into a state of believing that there’s milk in the fridge, which is, at that time, false."