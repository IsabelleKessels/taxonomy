name: "Change of Truth Value, Basis for Belief & Doxastic Attitude: Paradigmatic Knowledge to Counterfactual-Interference"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives in the moment.

    At t~2~ p is false, but S believes that non-p based on [Counterfactual-Interference in Modally Close non-p-Worlds], [Counterfactual-Interference in Modally Close p-Worlds], [Instrument Counterfactual-Interference in Modally Close non-p-Worlds] or [Instrument Counterfactual-Interference in Modally Close p Worlds].
comments: 
  - |
    To make Counterfactually Fake Video Call 13 conform with the [case-type], p must include a negation: 

    p = “Ben is *not* on a video call.”; non-p = “It’s *not* the case that Ben is *not* on a video call.” = “Ben is on a video call.”
tokens:
  - |
    Counterfactually Fake Video Call 13: Judy walks over to her line manager Ben’s workspace, he’s not wearing his headset and no video call app is open on his laptop, so she correctly judges he’s not on a call and asks him to have a talk. She tells him that she wants to apply for a job in another department. Ben is secretly upset about potentially losing Judy from the team, so is unwilling to write the letter of recommendation she asks for.

    A couple of days later, Judy approaches Ben’s workspace again. As in Keßels et al.’s (2026) Counterfactually Fake Video Call 1 (see B.4., [Counterfactual-Interference in Modally Close non-p-Worlds]), “Ben […] [is] determined to avoid talking to Judy at all costs. To deter Judy from addressing him, Ben had planned to fake being on a video call with Sara.” (n.pag.) This is because he fears, that Judy will ask whether he has finished writing her recommendation. However, as it so happens, “just when Judy approaches his workspace, Ben actually receives an unexpected video call from Sara.” (n.pag.) Thus, Ben doesn’t have to fake the call. Judy gains a true belief that Ben is on a video call.