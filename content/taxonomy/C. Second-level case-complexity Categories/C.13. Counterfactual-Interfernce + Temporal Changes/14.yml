tokens:
  - |
    Counterfactually Fake Video Call 16: Judy wants to talk to her line manager Ben and is about to walk over to his workspace. She’s aware that Ben has a weekly video call scheduled around this time, but based on wishful thinking, she believes that Ben isn’t on the call and will talk to her. As it so happens, it is true that Ben isn’t currently on a video call, since his meeting was unexpectedly cancelled. However, just in that moment, Judy herself receives an unexpected call from an important client. She postpones talking to Ben and takes the call.
 
    The next day, Judy decides that it is time to go over to Ben’s workspace and try to talk to him. As in Keßels et al.’s (2026) Counterfactually Fake Video Call 1 (see B.4., [Counterfactual-Interference in Modally Close non-p-Worlds]), “Judy doesn’t realise […] that Ben was determined to avoid talking to Judy at all costs. To deter Judy from addressing him, Ben had planned to fake being on a video call with Sara. […] However, just when Judy approaches his workspace, Ben actually receives an unexpected video call from Sara.” (n.pag.)