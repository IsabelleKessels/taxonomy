tokens:
  - |
    Counterfactually Fake Video Call 5: As in Keßels et al.’s (2026) Counterfactually Fake Video Call 1 (see B.4., [Counterfactual-Interference in Modally Close non-p-Worlds]), “Judy wants to talk to her line manager Ben. Approaching his workspace, Judy sees that Ben is talking into his headset and that a video call app is opened on his laptop.” (n.pag.) She forms the belief that Ben is on a video call. “What Judy doesn’t realise is that Ben was determined to avoid talking to Judy at all costs. To deter Judy from addressing him, Ben had planned to fake being on a video call with Sara. […] However, just when Judy approaches his workspace, Ben actually receives an unexpected video call from Sara.” (n.pag.)

    In this version, Judy walks away, but, since she has urgent things to discuss with Ben, drops by his workspace again a couple of hours later. Again, as it so happens, Ben is on a call with Sara just as Judy is approaching, and Judy forms the belief that Ben is on a call with Sara. If Sara hadn’t have called him, Ben would have faked a video call.
