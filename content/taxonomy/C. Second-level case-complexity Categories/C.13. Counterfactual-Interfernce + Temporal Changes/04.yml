tokens:
  - |
    Counterfactually Fake Video Call 6: As in Keßels et al.’s (2026) Counterfactually Fake Video Call 1 (see B.4., [Counterfactual-Interference in Modally Close non-p-Worlds]), “Judy wants to talk to her line manager Ben. Approaching his workspace, Judy sees that Ben is talking into his headset and that a video call app is opened on his laptop.” (n.pag.) She forms the belief that Ben is on a video call. “What Judy doesn’t realise is that Ben was determined to avoid talking to Judy at all costs. To deter Judy from addressing him, Ben had planned to fake being on a video call with Sara. […] However, just when Judy approaches his workspace, Ben actually receives an unexpected video call from Sara.” (n.pag.) 

    In this version, Judy ponders the following day whether it’s now a good time to try to talk to Ben again. Irrationally, she decides to determine whether she should believe that Ben is available to talk, or on a video call, through a coin toss. The result of the coin toss is such that she forms the belief that Ben is on a video call. As it so happens, this is true.