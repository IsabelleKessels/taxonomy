tokens:
  - |
    Counterfactually Fake Video Call 4: As in Keßels et al.’s (2026) Counterfactually Fake Video Call 1 (see B.4., [Counterfactual-Interference in Modally Close non-p-Worlds]), “Judy wants to talk to her line manager Ben. Approaching his workspace, Judy sees that Ben is talking into his headset and that a video call app is opened on his laptop.” (n.pag.) She forms the belief that Ben is on a video call. In this version, Ben is indeed on a call with Sara, but if he hadn’t been, he would have talked to Judy. 

    Judy walks away and sends Ben an email asking him for a meeting and explaining what she wants to discuss: She wants to apply for a job in another department. Ben is upset about potentially losing Judy from the team. He ignores the email and becomes “determined to avoid talking to Judy at all costs. To deter Judy from addressing him, Ben […] plan[s] to fake being on a video call with Sara.” (n.pag.). Since Ben ignored her email, Judy approaches his workspace unannounced the next day. As it so happens, “just when Judy approaches his workspace, Ben actually receives an unexpected video call from Sara.” (n.pag.) Thus, Ben doesn’t fake the call. Judy gains a true belief that Ben is, again, on a video call.