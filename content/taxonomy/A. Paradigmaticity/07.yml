name: "Unsuitable Reason"
descriptions:
  - "p is true, but S believes that p on unsuitable reasons (wishful thinking, wild guessing, coin-flipping, superstition, ignoring relevant counterevidence they possess etc.)."
comments:
  - |
    Weinberg et al. (2001) investigated Coin Flip in their x-phi study and report that “almost none of our subjects judged that this was a case of knowledge.” (451). Swain et al.’s (2008) included the vignette as well and report a mean response of 1.6, measured on a 5-point Likert scale where 1 indicated strong disagreement and 5 strong agreement that the agent knows the proposition in question (146). Wright’s (2010) study tested Coin Flip for order effects. In her first experiment participants “were equally likely to fail to attribute knowledge in Coin-Flip, regardless of which case immediately preceded (0–6%), χ^2^ (2, N = 133) = 2.50, p = .29” (493). Her second experiment included both Coin Flip and Ill Prepared Student: “Participants dominantly \[…\] failed to attribute knowledge in Coin-Flip (3%) and Guess \[Ill Prepared Student; IK\] (0–7%), regardless of order” (496).

    Weinberg et al. (2001) don’t state the sample sizes for their experiments, but based on the data given in figure 11 (490) the sample sizes must have been between 59 and 69 participants, respectively, for the two experiments that included this vignette. Swain et al.’s (2008) experiment had a sample size of n = 220 across eight conditions (141f.) and Wright’s (2010) two experiments had n = 188 (492) and n = 181 (496). Wright doesn’t specify the number of conditions participants were split between.
tokens:
  - "Weinberg et al.’s (2001) Coin Flip: “Dave likes to play a game with flipping a coin. He sometimes gets a ‘special feeling’ that the next flip will come out heads. When he gets this ‘special feeling’, he is right about half the time, and wrong about half the time. Just before the next flip, Dave gets that ‘special feeling’, and the feeling leads him to believe that the coin will land heads. He flips the coin, and it does land heads.” (451.)"
  - "Wright’s (2010) Ill Prepared Student: “Laura’s math teacher asks everyone to perform a difficult math problem. Laura realizes that she has no idea how to do the problem and so she just sits there and doodles. After about a minute, the math teacher asks Laura to report to the class what answer she had gotten. Not knowing what else to do, Laura blurts out ‘35’ as a completely random guess. As it turns out, this is the correct answer and the teacher congratulates Laura for a job well done.” (502.)"
