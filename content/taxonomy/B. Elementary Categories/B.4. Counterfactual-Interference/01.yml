name: "Counterfactual-Interference in Modally Close non-p-Worlds"
descriptions:
  - |
    In the @-world p is true and S believes that p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives in the moment.

    In modally close possible worlds, there would be an interference to the effect that p would be false while S’s evidence supporting p would be indistinguishable (for S) from that in @ word, so that S would falsely believe that p.
comments:
  - "Intuitions about token-cases appear to be conflicted: We observe disagreement between armchair philosophers about the same token, alongside divergence in the same author’s intuitions about different tokens of this [type]. Further research is needed."
  - "Neta and Rohrbaugh (2004) intuit about Water: “Despite the falsity of my belief in the nearby possibility, it seems that, in the actual case, I know that I am drinking pure, unadulterated water.” (400.) In contrast to this, Pritchard (2014) states: “My initial reaction to such a case is to hold that it is simply not a case of knowledge.” (159.)"
  - "Grundmann’s (2020) Automated Halloween Party is an adaptation of Comesaña’s (2005) Halloween Party, subsumed under C.3., [Deliberate Counterfactually False Testimony Through Interference with p]. The present token avoids the complicating factor of {{< sc >}}Testimony{{< /sc >}}. Grundmann intuits about the case: “Intuitively, […] Juan knows where he will find Andy’s party, if he does not dress up as Michael.” (5175.) However, Grundmann (2020) intuits on Playful Barn Demon 1: “[I]n this case Guy does not know[.]” (5171.) He points out that “the deceiving objects exist only counterfactually” (5171)."
  - "Keßels et al.’s (2026) x-phi study included Fake Video Call as well as a version of Water. On a Likert scale from 1 to 7, where 7 indicated the attribution of knowledge, and 1 the attribution of lack of knowledge, the mean response was 5.37 (n = 520, SD = 2.00) to Fake Video Call and 4.82 to Water (n = 520; SD = 2.17)."
  - |
    Taking the limited x-phi data as an indication that tokens of this [case-type] tend to be evaluated as knowledge; one would expect that tokens where the interference-worlds are relatively remote would evoke a stronger knowledge-intuition. Armchair philosophers’ reported intuitions contradict this hypothesis; albeit, again, with disagreement between different authors:

    Dretske (1971) intuits about Backup Volcano: “[S] does not know it was M that erupted – not unless he has some additional grounds which preclude N.” (5.)

    Pappas and Swain (1973) intuit about Backup Generator: “[S]urely, we do not want to say that the fact that his friend has a generator in his basement prevents S from having knowledge that the company's generators are causing the lights to be on.” (76.) In contrast, Shope’s (1983) take on both Backup Generator and Backup Volcano is this “I believe that we should regard them as cases of ignorance.” (226.)
tokens:
  - "Neta and Rohrbaugh’s (2004) Water: “I am drinking a glass of water which I have just poured from the bottle. Standing next to me is a happy person who has just won the lottery. Had this person lost the lottery, she would have maliciously polluted my water with a tasteless, odorless, colorless toxin. But since she won the lottery, she does no such thing. Nonetheless, she *almost* lost the lottery. Now, I drink the pure, unadulterated water and judge, truly and knowingly, that I am drinking pure, unadulterated water. But the toxin would not have flavored the water, and so had the toxin gone in, I would still have believed falsely that I was drinking pure, unadulterated water.” (399f.)"
  - "Grundmann’s (2020) Automated Halloween Party: “There is a Halloween party at Andy’s house and Juan is invited. The house is very difficult to find, so Andy employs a device that stands at a crossroads and directs people towards his house. Unbeknownst to Juan, Andy doesn’t want Michael to come to his party, so he manipulates the device such that if it registers Michael (through a built-in camera), it sends a signal to Andy, who then will move his party to Adam’s house. Juan seriously considers dressing up as Michael, but at the last moment doesn’t. When he goes to the crossroads, he is directed to the party by the device. Juan truly believes that he will find Andy’s party at the location to which the device directs him.” (5175.)"
  - "Grundmann’s (2020) Playful Barn Demon 1: “Guy is driving through the countryside and sees a genuine barn under excellent observation conditions. On the basis of his vision he believes that there is a barn. In fact, all the other barn-shaped buildings in the vicinity are real barns. However, there is malicious demon watching him. He would have transformed all the real barns, including the one Guy is actually looking at, into barn-façades, if heads had won a coin-toss just performed.” (5171.)"
  - |
    Keßels et al.’s (2026) Counterfactually Fake Video Call 1: “Judy wants to talk to her line manager Ben. Approaching his workspace, Judy sees that Ben is talking into his headset and that a video call app is opened on his laptop. Judy notices that the video image on Ben’s screen is of Sara, the company’s managing director. ‘Ben is on a call with Sara’ Judy thinks to herself, ‘I better not disturb him now!’.

    What Judy doesn’t realise is that Ben was determined to avoid talking to Judy at all costs. To deter Judy from addressing him, Ben had planned to fake being on a video call with Sara. To that end, Ben had recorded a past video call with Sara. Ben had intended to play this recording on his laptop and put on his headset, if he’d see Judy approaching his workspace. To onlookers, it would have appeared just as if Ben was on a video call with Sara. However, just when Judy approaches his workspace, Ben actually receives an unexpected video call from Sara. She’s calling because they both participate in a lottery pool, and Sara has just learned that the numbers she picked won. Sara wanted to share this happy news with Ben immediately. If their numbers hadn’t come up, however, Sara wouldn’t have bothered to call him. But since they did win the lottery, Ben is on a video call with Sara just as Judy comes to check whether he’s busy. Does Judy know that Ben’s on a video call with Sara?” (n.pag.)
  - "Here are two cases where the possible worlds in which the interference would occur are much more remote:"
  - "Pappas and Swain’s (1973) Backup Generator: “*S* works for the local electric company, and is thoroughly knowledgeable concerning the way in which the company’s generators are responsible for the transmission of electricity to homes in the area. He knows that the company equipment has just been inspected and found to be in good working order, and he knows that the equipment has always been reliable in the past. One evening he visits at the home of a friend. On the way he notices that the street lights are burning, homes have lights on inside of them, and so forth. When he arrives at his friend’s home, he notes that the lights are on there as well. He concludes that his company’s generators are at that time causing the lights to be on in his friend’s home (*P*). […] [E]entirely unknown to *S*, his friend has a private generator in the basement of his home, and the generator is rigged in such a way that it will automatically produce electricity for his home if there should be an electric company failure. […] Even if *P* were false, *S* would still have the same reasons, *R*, for believing that *P*. His background evidence would remain exactly the same, and his present perceptual evidence, although misleading, would be the same.” (75.)"
  - "Dretske’s (1971) Backup Volcano: “Goldman […] constructs a situation in which S is said to know that a nearby mountain (I will call it M) erupted many years ago. He knows this on the basis of the presence of solidified lava throughout the countryside surrounding the mountain. […] [C]onsider the following embellishment on Goldman’s example. Not far from M is another mountain, N. The geology of the area is such that at the point in time at which M erupted something, so to speak, was bound to give; if M had not erupted, N would have. Furthermore, the location of N is such that if it, rather than M, had erupted, the present distribution of lava would have been, in all respects relevant to S’s taking it as a reason for believing M erupted, the same.” (4f.)"
