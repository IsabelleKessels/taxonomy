name: "Unfriendly Instruments Environment"
descriptions:
  - "Several instruments of the same type are available to S. Unknown to S, only some of them work reliably. As it so happens, S uses one of the reliable instruments; it displays “p~1~”, which is true. S believes that p~1~ based on the true (explicit or implicit) premise that the instrument is reliable. Had S used a malfunctioning instrument, S would have formed a false belief that non-p~1~ (or that p~n~, where p~n~ would be false)."
comments:
  - "Goldman (1986) intuits about Broken Thermometers 1: “[W]e would not want to say that the parent knows that the child’s temperature is normal[.]” (45.)"
  - "Grundmann (2020) intuits about Fake Clock Country: “Intuitively, Olivia relies on reading a genuine clock as her method in this case. She thereby acquires knowledge of the correct time.” (5177.)"
  - |
    Keßels et al.’s (2026) x-phi study supports Grundmann’s intuition. The illustrative detail of the vignette Fake Clock Shop is very similar to Fake Clock Country). On a Likert Scale from 1 to 7, where 7 indicated the attribution of knowledge, the mean response was 5.15 (n = 520; SD = 2.10) (compared to a mean response to Fake Barns of 5.72; n = 520; SD = 1.79).

    Further research is necessary. In particular, we’d need to test whether Goldman’s knowledge-intuition about Broken Thermometers 1 can be supported by x-phi data as well, which would indicate that there’s a so-far overlooked structural difference between the two tokens. I would hypothesise, however, that this isn’t the case.
  - "Greco (2010) intuits about Careless Math Student: “It seems wrong to say that *S* thereby knows the answer to the problem, however.” (149.)"
tokens:
  - "Goldman’s (1986) Broken Thermometers 1: “Suppose a parent takes a child’s temperature and the thermometer works properly, so that if the child’s temperature were not 98.6, it would not read 98.6 and the parent would not believe that the temperature is normal. […] But now suppose there are many thermometers in the parent’s medicine cabinet, and all but the one actually selected are defective. All others would read 98.6 even if the child had a fever. Furthermore, the parent cannot tell which thermometer is which; it was just luck that a good thermometer was selected.” (45.)"
  - "Grundmann’s (2020) Fake Clock Country: “Olivia is in fake-clock country. She actually wants to consult a trustworthy clock and just happens to read the only properly working genuine clock in the vicinity. All the other clocks are similar-looking dummies. Olivia forms her belief upon reading the real clock, but she might easily have formed her belief on reading one of the dummies instead.” (5177.)"
  - "Keßels et al.’s (2026) Fake Clock Shop: “Alice is waiting for her friend Tony to arrive at their meeting point in the city. She decides to pass the time by browsing the nearby jeweller’s window display. She starts by looking at the display to the right of the shop door. Her glance falls on the only watch in that display case, a women’s watch which shows 10:15. Just in that instance, Tony taps her on the shoulder. Alice thinks to herself ‘Tony’s perfectly on time, it’s exactly 10:15!’. It is indeed 10:15 at that moment, but what Alice doesn’t realise is that the watch she is looking at is the only watch in the store showing the correct time. The window display to the left of the store contains several men’s watches that aren’t equipped with batteries. All of these are set to show 10:10, as this position of the clock’s hands looks most aesthetically pleasing. However, Alice doesn’t get to look at the men’s watches, since Tony and her head off to enjoy their morning together. Does Alice know that it’s 10:15, when Tony arrives?” (n. pag.)"
  - "Employing the broader conception of ‘instruments’ I suggested in the introduction to B.2., fn. 4, the following case also fits this [type]. Greco’s (2010) Careless Math Student: “S is taking a math test and adopts a correct algorithm for solving a problem. But suppose that S has no understanding that the algorithm is the correct one to use for this problem. rather, S chooses it on a whim, but could just as well have chosen one that is incorrect. By hypothesis, the algorithm is the right one, and so using it to solve the problem constitutes a reliable process.” (149.)"
