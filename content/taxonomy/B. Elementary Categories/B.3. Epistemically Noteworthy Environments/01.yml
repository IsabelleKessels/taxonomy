name: "Unfriendly Environment"
descriptions:
  - "Unknown to S, S is in an environment featuring misleading evidence in regards to p~1~ (or p type propositions). By chance, S only perceives the non-misleading evidence and, based on this, forms the belief that p~1~, which is true. Had S been confronted with the misleading evidence, S would have formed a false belief that non-p~1~ (or that p~n~, where p~n~ is false)."
comments:
  - "Goldman (1976) intuits about Fake Barns: “[W]e would be strongly inclined to withdraw the claim that Henry knows the object is a barn.” (772.) As Colaço et al. (2014) report, this verdict is widely accepted in the armchair philosophy literature (200). Numerous x-phi studies investigating tokens of this [type], however, indicate a different evaluation-behaviour for non-philosophers: There’s an observable tendency, shown by tokens’ ranking on a Likert scale, for responses to either fluctuate around the neutral point or tend towards an evaluation as knowledge (see, e.g., Swain et al. 2008, Colaço et al. 2014, Wright 2010, Horvath & Wiegmann 2016, Turri 2017, Keßels et al. 2026). Colaço et al. (2014) summarise: “[I]f we do interpret responses that are higher than the mid-point as attributions of knowledge, and if our findings are indicative of how non-philosophers would react to these and other fake-barn style cases, then non-philosophers do not share the philosophically popular intuition.” (206.) Results differ in whether Fake Barns is subject to order effects: Swain et al.’s (2008) report that their data doesn’t support that there is an order effect for Fake Barns: “[M]ean responses varied only from 3.5 to 3.8. The ANOVA on response to the Fakebarn Case based on survey version did not reveal a significant effect. In fact, it suggests that responses to the Fakebarn Case are immutable with respect to whether, and which, other cases precede it (ANOVA, p = .980).” (146). In contrast, Wright (2010) data indicates the opposite: “[P]articipants were (marginally) less likely to count Suzy’s mental state as knowledge when the case immediately followed either Testimony or Coin-Flip (40% and 39%, respectively) than when it immediately followed True-Temp (59%): χ^2^ (2, N = 144) = 4.91, p = .086” (493)."
  - "Klein (1971) intuits about Tom Grabit’s Twin: “Although S has a true and evident belief that Tom stole the book, it can hardly be certified as knowledge[.]” (471.)"
  - |
    Turri et al. (2015) investigate Fake Squirrels in their x-phi study and report: “When the threat failed to prevent Darrel from detecting the truth, participants attributed knowledge at rates exceeding chance [67%; IK], and indeed, at rates not significantly different from a case in which no such threat was mentioned [81%; IK].” (381.) Their experiment had a relatively small sample size of n = 135 split across three conditions with 15 participants excluded after failing comprehension tasks (380). Further research is required to test the validity of their results.

    In the formulation of Fake Squirrels, it is not exactly clear, whether the binoculars are central to Darrel seeing the squirrel – I assume they are not. If they were, the belief-formation process would involve [Sensory Help] and the case would need to be grouped with a second-level complexity {{< sc >}}Category{{< /sc >}} which additionally involves {{< sc >}}Help or Hindrance{{< /sc >}}.
  - "Horvath and Wiegmann (2016) surveyed philosophers about less canonical tokens of this [type] and found “that the intuitions of expert epistemologists are not in line with the consensus in the literature” (2720). Asking participant to rank their agreement with the claim that the agent gains knowledge on a 6-point Likert scale, where 1 indicates strong disagreement and 6 strong agreement, they found that, in their first experiment “lay subjects’ (M = 4.79, SD = 1.20) agreed significantly stronger with the claim that the Rodin expert knows that the sculpture in front of her is one of Rodin’s famous marble sculptures than expert subjects (M = 3.77, SD = 1.67), F(l, 222) = 28.06, p < .001, ƞ^2^ = .11” (2712). Their second experiment confirms these results: “Lay subjects (M = 4.94, SD = 1.35) agreed significantly stronger with the claim that the Rodin expert knows that the sculpture in front of her is one of Rodin’s famous marble sculptures than expert subjects (M = 3.72, SD = 1.8 6), F(l, 225) = 26.83, p < .001, ƞ^2^ = .11.” (2716.) The first experiment had a sample size of n = 224 (whereof 82 were classified as experts and 142 as lay people) (2711); the second experiment had a sample size of n = 227 (50 experts and 177 laypeople) (2716)."
tokens:
  - "Goldman’s (1976) Fake Barns: “Henry is driving in the countryside with his son. For the boy’s edification Henry identifies various objects on the landscape as they come into view. ‘That's a cow,’ says Henry, ‘That’s a tractor,’ ‘That’s a silo,’ ‘That’s a barn,’ etc. Henry has no doubt about the identity of these objects; in particular, he has no doubt that the last-mentioned object is a barn, which indeed it is. […] [E]ach object is fully in view, Henry has excellent eyesight, and he has enough time to look at them reasonably carefully, since there is little traffic to distract him. […] Suppose […] that, unknown to Henry, the district he has just entered is full of papier-mâché facsimiles of barns. These facsimiles look from the road exactly like barns, but are really just façades, without back walls or interiors, quite incapable of being used as barns. They are so cleverly constructed that travelers invariably mistake them for barns. Having just entered the district, Henry has not encountered any facsimiles; the object he sees is a genuine barn. But if the object on that site were a facsimile, Henry would mistake it for a barn.” (772f., Goldman credits Carl Ginet as the inventor of the case.)"
  - "Klein’s (1971) Tom Grabit’s Twin: “Suppose that S has been working in an office next to Tom Grabit’s office for many years and has often spoken informally with Tom, but does not know anything at all about Tom’s personal life. One day he sees what he takes to be Tom stealing a library book. S would be justified in believing that Tom did steal the book and he is correct. But, unbeknown to S, Tom has an identical twin who was in town in the library on the day in question. Further, Tom has never stolen a book from the library and John, Tom’s twin, is a kleptomaniac who steals books quite often.” (471.)"
  - "Turri et al.’s (2015) Fake Squirrels: “Darrel is an ecologist collecting data on red speckled ground squirrels in Canyon Falls national park. The park is divided into ten zones and today Darrel is working in Zone 3. ¶ While scanning the river valley with his binoculars, Darrel sees a small, bushy-tailed creature with distinctive red markings on its chest and belly. The red speckled ground squirrel is the only native species with such markings. Darrel records in his journal, ‘At least one red speckled ground squirrel in Zone 3 today’. […] Ecologists are unaware that a non-native species of prairie dog recently began invading the park. These prairie dogs also have red markings on their chest and belly. When these prairie dogs tried to invade Zone 3, the red speckled ground squirrels were unable to completely drive them away. [T]he animal Darrel is looking at is […] a red speckled ground squirrel[.]” (380f.)"
  - "Horvath and Wiegmann’s Fake Scuptures (2016) “The director of a sculpture museum is so impressed with recent improvements of hologram images that she decides to perform a secret test on the visitors of her museum. To this end, she orders hologram images that even art experts cannot visually distinguish from the real sculptures in her museum, and she replaces all but one of the sculptures by their hologram image. As the director had expected, no one realizes any difference between the hologram images and the real sculptures. One day, the world’s greatest Rodin expert is visiting her museum. standing in front of a famous marble sculpture by Rodin, which is the only real sculpture that is presently on display in the museum, and she thinks to herself: ‘I’m facing one of Rodin’s famous marble sculptures now.’” (2708f.)"
