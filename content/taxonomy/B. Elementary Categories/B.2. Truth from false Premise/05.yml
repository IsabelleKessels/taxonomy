name: "Instrument Knowledge From Falsehood"
descriptions:
  - |
    S reads an instrument, which displays “q~1~.” The instrument isn’t entirely reliable: The values it displays can deviate from the actual value by a margin of plus or minus *m*. The actual value of the factor that’s measured is q~n~, where q~n~+*m* ≥ q~1~ or q~n~−*m* ≤ q~1~ (it may, or may not, be that q~n~ = q~1~). S is unaware that the instrument malfunctions, but S is broadly uninterested in the exact value of the factor the device measures. Based on reading the instrument, S forms a belief p which is (deductively, inductively, or abductively) entailed by a range of values that the factor could take, including all values between q~n~−2*m* and q~n~+2*m*.

    In modally close worlds, where p would be false, the instrument would not display “q~1~,” because the actual value of the factor would not be within the range of q~n~+*m* ≥ q~1~ or q~n~−*m*.
comments:
  - |
    Tokens may diverge in whether q~1~ is true because q~n~ = q~1~, i.e., the instrument actually displays the correct value, or whether p~1~ is false. If the former applies, then the false premise is limited to the assumption that the instrument works reliably; if the latter applies, there is an additional false assumption that q~1~ is true. – If it turns out that evaluation behaviours between tokens where q~1~ is true diverges from those where q~1~ false, then we need to build separate [case-types].

    One could argue that, in those cases where q~1~ turns out true by chance and the only false belief is the assumption about the instrument’s reliability, we have a combination of *gettiering*  and ‘Knowledge From Falsehood’: The misleading evidence for the instrument’s reliability (it always *roughly* shows the correct value) is interdependent on the backup truth-maker for p (in modally close possible worlds where the belief p would be false, the instrument would not show a value indicating p, because it’s always roughly correct); yet, this misleading evidence is independent of the backup truth-maker for q~1~ specifically (there are possible worlds where the instrument shows the value q~1~ and this value is incorrect).
  - "Warfield (2005) intuits about Time Shift: “Despite all of this complexity (and, indeed, partly because of it) I still know my conclusion.” (407.) And about Exact Time “Again I know my conclusion[.]” (408.)"
  - "Klein (2008) intuits about Ptolemaic Astronomer: “[I]t is plausible to believe that at least some people will take it to be a case of a false belief producing knowledge.” (38.)"
  - "Baumann (2014) doesn’t state his intuition on Speedometer, but it is implied he takes it to be an example of knowledge. Speedometer is the only token-case listed here, where it is explicitly stated that q~n~ = q~1~, i.e., the instrument actually displays the correct value, which means here the false premise is limited to the assumption that the instrument works reliably; for the Ptolemaic Astronomer, this may be the case, but it’s left implicit."
  - "Zhao (2022) intuits about Speedometer 2: “Intuitively, Angela’s belief that *she is driving above 60 mph* counts as knowledge though it is inferred from the falsehood that *she is driving at 79 mph*.” (836.)"
tokens:
  - "Warfield’s (2005) Time Shift: “My doctor has ordered that I get at least 8 hours sleep per night. I knowingly go to bed at 11pm. I wake up and see the clock reading ‘2:30am’. I reason: (premise) I’ve been asleep 3½ hours, so (conclusion) I haven’t slept the mandated 8 hours. My premise is false. I’ve forgotten that it’s the night of the (Fall) time change and I have a clock that automatically resets in the appropriate way at the appropriate time and it has already done this. So I’ve been asleep 4½ hours (we’re at ‘2:30am’ for the 2nd time).” (497)"
  - "Warfield’s (2005) Exact Time: “I have a 7pm meeting and extreme confidence in the accuracy of my fancy watch. Having lost track of the time and wanting to arrive on time for the meeting, I look carefully at my watch. I reason: ‘It is exactly 2:58pm; therefore I am not late for my 7pm meeting’ […] but as it happens it’s exactly 2:56pm, not 2:58pm.”"
  - "Klein’s (2008) Ptolemaic Astronomer: “The date is 2 September 1203; the place is Oxford University. An astronomy class is in session and the instructor, one of the most noted Ptolemaic astronomers of the thirteenth century, is showing students how to calculate the relative positions of the sun and planets both backward and forward in time using the deferent and epicycle orbits of those bodies and their (then) current positions. After carefully explaining the method, he asks the students to determine whether Mars will be visible from the earth 800 years later, supposing, of course, that it is not cloudy that night, that both the Earth and Mars still exist, and so on. The students enter the (then) current relative positions of the Sun, Mars, and Earth as they believe them to be according to Ptolemaic astronomy and then they extrapolate using the method they have just learned. They conclude that, *ceteris paribus*, Mars will be visible on 2 September 2003. On the assumption that the assigned orbits and then-current relative positions of the three bodies allow for sufficiently accurate extrapolations, the students know that Mars will be visible on 2 September 2003, even though their beliefs are based on false beliefs about the fxed position of the Earth and the orbits of the Sun and Mars.” (37.)"
  - "Baumann’s (2014) Speedometer: “[S]uppose that I am driving in my car and have no idea whether I’m above the speed limit of 35 mph. I look at the speedometer and it reads ‘72 mph’. And I am really going at 72 mph. However, my speedometer usually does not get the speed right exactly but diverges by a few miles from the true number. Thus, my belief that I am going at 72bmph is true by luck. Suppose I infer that I am way above the speed limit.” (533f.)"
  - "Zhao’s (2022) Speedometer 2: “Angela regularly accepts what the speedometer in her car says at face value. Her present belief, so formed, is that *she is driving at 79 mph* though she is actually driving at 74 mph. The problem is that the speedometer usually does not get the speed right exactly but diverges by a few miles from the true number. The error could be as large as 5 mph. Angela sees a posted speed limit of 60 mph and goes on to infer that *she is driving above 60 mph*.” (835.)"
