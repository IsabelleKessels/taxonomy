name: "Direct Gettier"
descriptions:
  - |
    q is false. S misperceives some specific detail, so that it seems to S that q was true, however, S doesn’t form the belief that q. Instead, S forms a more general belief p, that is entailed by q. There is a backup truth-maker for p, so p happens to be true.

    The backup truth-maker is independent of the presence of misleading evidence for q: In some modally close worlds where q would be false, S would have the same misperception and would form the belief p based on this, but no backup truth-maker would be present, so p would be false.
comments:
  - |
    The proposition q usually describes the agent’s impression of a state of affairs in a relatively detailed way, whereas p stands for a vaguer description of the same state of affairs:

    Chisholm’s Sheep 1: p = “There is a sheep in the field.”; q = “The object in the distance, that I’m looking, at is a sheep.”

    William’s Candle: p = “There is a candle in front of me.”; q = “The thing in front of me, that I am looking at, is a candle.”

    Zagzebski’s Husband: p = “My husband is sitting in the living room.”; q = “My husband is the person that’s sitting the in the chair that’s facing the door in the living room.”

    Turri’s Zebra: p = “There is a zebra on the first floor of the building.”; q = “The animal I just saw on the first floor of the building is a zebra.”

    Keßels et al.’s Office Walter: p = “There’s a bottle of clean, pure water in the fridge.”; q = “The bottle I saw in the fridge contains clean, pure water.”
  - "Chisholm (1966/1989) intuits about Sheep 1: “[T]he situation does not warrant our saying that the person *knows* that there is a sheep in the field.” (93.) "
  - "Williams (1996) intuits about Candle: “Do I know there is a candle in front of me? It seems not. But do I go through any reasoning, [sic!] defects in which might be blamed for my failure to know? Not consciously. My belief that there is a candle in front of me seems more like an immediate reaction to how things look than the result of inference.” (94.)"
  - "Zagzebski (1994) intuits about Husband: “[S]he does not have knowledge.” (68.)"
  - "Turri (2013) investigated Zebra in his x-phi study and reports “100% of participants answered that Zach ‘only thinks he knows’” (8). His experiment had a very small sample size of n = 24, with 6 participants excluded after failing comprehension tasks (7). Further research is required to test the validity of his results."
  - "Keßels et al.’s (2026) study asked non-philosophers to evaluate Office Water on a Likert scale from 1 to 7, where 7 indicated the attribution of knowledge, and 1 the attribution of lack of knowledge. The mean response was 3.21 (n = 520; SD = 2.22). The study also included a vignette closely modelled after Sheep 1, here, the mean response was 3.03 (n = 520; SD = 2.05), which is in line with Chisholm’s intuition."
tokens:
  - "Chisholm’s (1966/1989) Sheep 1: “A person *takes* there to be a sheep in the field and does so under conditions which are such that, when under those conditions a person takes there to be a sheep in the field, then it is *evident* for that person that there is a sheep in the field. The person, however, has mistaken a dog for a sheep and so what he sees is not a sheep at all. Nevertheless it happens that there *is* a sheep in another part of the field.” (93.) "
  - "Williams’ (1996) Candle: “[A]n arrangement of mirrors makes it look to me as if there is a candle in front of me; […] everything looks the way it would if things were entirely normal, so that I have no reason to suspect that the appearance is produced by mirrors: filling in the details appropriately, it will seem that I am justified in believing that there is a candle in front of me. But […] someone has left a candle behind one of the mirrors, so that my belief is true.” (94.)"
  - "Zagzebski’s (1994) Husband: “Suppose that Mary has very good eyesight, but it is not perfect. It is good enough to allow her to identify her husband sitting in his usual chair in the living room from a distance of fifteen feet in somewhat dim light […]. She has made such an identification in these circumstances many times. […] Suppose Mary […] misidentifies the chair-sitter who is, let us suppose, her husband’s brother. Her faculties may be working as well as they normally do when the belief is true and when we do not hesitate to say it is warranted in a degree sufficient for knowledge. […]. Her degree of warrant is as high as it usually is when she correctly identifies her husband[.] […] We can now easily emend the case as a Gettier example. Mary’s husband could be sitting on the other side of the room, unseen by her. […] [H]er belief ‘my husband is sitting in the living room’ is true[.]” (67f.)"
  - |
    Turri’s (2013) Zebra: “Zach has an appointment with his lawyer in an office building in New York City. As he enters the lobby on the first floor, he sees something highly unexpected: a large animal with black and white stripes under a banner that says, ‘Pet a zebra for children’s charity.’ In exchange for a $10 donation to a local children’s charity, you get to pet this illustrious animal. Zach quickly walks up the stairs to his lawyer’s office on the second floor. He greets the receptionist and says, ‘Guess what? There is a zebra down on the first floor of the building.’[…]

    The people running the charity could not afford to rent a real zebra for the charity drive. So instead they hired an artist to paint black and white stripes on a mule. The animal Zach saw in the first-floor lobby was actually a cleverly disguised mule. It looks just like a zebra, but it isn’t. It’s a mule. […] The office building that Zach is in is very large. One of the companies renting space in the building is in the business of importing exotic animals. It is illegal for them to keep these animals in an office building, but they do it anyway. They recently acquired a zebra and are keeping it well-hidden in a locked, sound-proof room on the first floor of the building.” (7.)
  - "Keßels et al.’s (2026) Office Water: “Mary looks in the refrigerator in her office’s break room. She sees a bottle of sparkling mineral water and several food containers. Since she’s thirsty, but doesn’t like sparkling water, Mary gets herself a glass of water from the tap instead. Back at her desk, her colleague Andy comments on her choice of drink: ‘Is that tap water? […]’ Mary answers him: ‘Should you fancy it, there’s a bottle of clean, pure water in the fridge!’ What Mary doesn’t realise is that the bottle of water she looked at actually is contaminated with a tasteless, odourless, and colourless toxin. However, behind one of the food containers, and hidden from Mary’s view, there is another bottle in the fridge, which does indeed contain clean, pure water. Does Mary know that the fridge contains a bottle of clean, pure water?” (n.pag.)"
