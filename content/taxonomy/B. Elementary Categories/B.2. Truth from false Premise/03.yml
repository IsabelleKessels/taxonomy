name: "Instrument Gettier"
descriptions:
  - |
    S reads an instrument, which displays “p~1~.” The instrument isn’t reliable in the given context (it’s broken, not meant for this specific purpose, has been tampered with, etc.). S isn’t aware of its malfunction. S believes that p~1~ based on the false (explicit or implicit) premise that the instrument is reliable. As it so happens, p~1~ is true.

    In some modally close worlds, S would read the same instrument, which would display “p~n~” and S would form the belief p~n~ based on this, but p~n~ would be false.
comments:
  - "Tokens of this [type] can take a form analogous to [False Premise Gettier] or to [Direct Gettier], depending on whether S explicitly forms the supportive belief q that the instrument is reliable."
  - "Russell (1948) intuits about Stopped Clock: “[T]his man acquires a true belief as to the time of day, but cannot be said to have knowledge.” (40.)"
  - "Machery et al. (2018) investigated Stopped Clock in two experiments of their x-phi study. When presented with the response options “‘Yes, [s]he knows’ and ‘No, [s]he doesn’t know’” (128), 33.7% of participants ascribed lack of knowledge in the first experiment (130); and “35.3%” (135) in the second. Participants were furthermore asked: “‘In your view, which of the following sentences better describes [the protagonist’s] situation?’ followed by two choices: (i) ‘[Protagonist] knows that [relevant proposition],’ and (ii) [Protagonist] feels like s[he] knows that [relevant proposition] but [s]he doesn’t actually know [this]” (129). Here, 52.3% of the participants choose response (ii) for Clock 2 (130) in the first experiment; and “63.3%” (135) in the second. Machery et al.’s (2018) first experiment had a sample size of n = 520 with 170 participants excluded for failing comprehension tasks (126f.), the second one had a sample size of n = 306 with 8 participants excluded for being younger than 18 or failing comprehension tasks (134). Keßels et al.’s (2026) study includes a vignette closely modelled after Machery et al.’s. The mean response was 4.41 (n = 520; SD = 2.23) on a Likert scale from 1 to 7, where 7 indicated the attribution of knowledge, and 1 the attribution of lack of knowledge (Keßels et al. 2026, n.pag.).  As these examples show, there is some tension between armchair assumptions and x-phi’s results about Stopped Clock."
  - "Williams and Sinhababu (2015) judge that “[s]ince you do not know that it is 4:30 pm in *Stopped Clock* then surely you do not know that it is 4:30 pm in *Backward Clock* either” (48). Backward Clock differs from Stopped Clock in *which false proposition* is believed in close possible worlds: “If it were not 4:30 pm but some other time, then by looking at the clock you would not believe that it is 4:30 pm. Instead you would form some other false belief about what time it is. For example, if you had looked at it at 4:31 pm, then you would not form the false belief that it is 4:30 pm. Instead you would form the *false* belief that it is 4:29 pm.” (48.) The agent could gain a variety of beliefs p~1~, p~2~, p~3~, p~4~,… by consulting Backwards Clock, whereas consulting Stopped Clock would yield the same the belief p~1~."
tokens:
  - "Russell’s (1948) Stopped Clock: “There is the man who looks at a clock which is not going, though he thinks it is, and who happens to look at it at the moment when it is right[.]” (140.)"
  - "Machery et al.’s (2018) x-phi vignette for Stopped Clock: “Wanda is out for a weekend afternoon walk. As she passes near the train station, she wonders what time it is. She glances up at the clock on the train station wall, sees that it says 4:15 p.m., and concludes that it is 4:15 p.m. What she doesn’t realize is that this clock is broken and has been showing 4:15 p.m. for the last two days. But by sheer coincidence, it is in fact 4:15 p.m. just at the moment when she glances at the clock.” (127.)"
  - "Williams and Sinhababu’s (2015) Backward Clock: “You habitually nap between 4 pm and 5 pm. Your method of ascertain- ing the time you wake is to look at your clock, one you know has always worked perfectly reliably. Unbeknownst to you, your clock is a special model designed by a cult that regards the hour starting from 4 pm today as cursed, and wants clocks not to run forwards during that hour. So your clock is designed to run perfectly reliably backwards during that hour. At 4 pm the hands of the clock jumped to 5 pm, and it has been running reliably backwards since then. This clock is analogue so its hands sweep its face continuously, but it has no second hand so you cannot tell that it is running backwards from a quick glance. Awaking, you look at the clock at exactly 4:30 pm and observe that its hands point to 4:30 pm. Accordingly, you form the belief that it is 4:30 pm.” (48.)"
