name: "Change of Basis for Belief: Paradigmatic Knowledge to Paradigmatic Knowledge"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises].

    At t~2~ p is true and S believes that p based on a different instance of [Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises] than at t~1~.
comments:
  - |
    Turri et al. (2015) investigated Wandering Squirrel Control 1 in their x-phi study and report that it “was overwhelmingly viewed as a case of knowledge” (382), with 88% judging that Darrel ‘knows’ rather than ‘just believes’ (382). This vignette serves as the control for their Wandering Squirrel 1, subsumed under C.8., [Change of Basis for Belief: Emerging Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]. The present token avoids the complicating factor of {{< sc >}}Truth From False Premise{{< /sc >}}. The experiment had a relatively small sample size of n = 141 split across three conditions with 6 participants excluded after failing comprehension tasks and 3 excluded for having partaken in previous studies (382).

    In the formulation of Wandering Squirrel Control 1, it is not exactly clear, whether the binoculars are central to Darrel seeing the squirrel – I assume they are not. If they were, the belief at t1 would count as based on [Sensory Hindrance] and the case would need to be grouped with a second-level complexity {{< sc >}}Category{{< /sc >}} which additionally involves {{< sc >}}Help or Hindrance{{< /sc >}}.
  - |
    Starmans and Friedman (2012) investigated Burglar Control 1 in their x-phi study and report that “participants attributed knowledge at rates greater than chance in both the Control condition (88%)” (275). This vignette serves as one of the control cases for their case Pen Burglar, subsumed under C.8., [Change of Basis for Belief: Emerging Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]. For the other control case, see below, Pen Burglar Control 2 [Change of Truth Value & Basis for Belief: Paradigmatic Knowledge to Paradigmatic Lack of Knowledge]. The control cases avoid the complicating factor of {{< sc >}}Truth From False Premise{{< /sc >}}.

    The experiment had a small sample size of n = 144 split across three conditions, with 38 participants excluded after failing comprehension tasks and an undisclosed number excluded for having partaken in previous studies (274).
tokens:
  - "Turri et al.’s (2015) Wandering Squirrel Control 1: “Darrel is an ecologist collecting data on red speckled ground squirrels in Canyon Falls national park. The park is divided into ten zones and today Darrel is working in Zone 3. ¶ While scanning the river valley with his binoculars, Darrel sees a bushy-tailed creature with distinctive red markings on its chest and belly. The red speckled ground squirrel is the only native species with such markings. Soon Darrel packs up his gear and hikes back to base camp. ¶ When Darrel returns to camp, his colleague says, ‘A reporter is going to do a story on local wildlife and she needs some video footage of a red speckled ground squirrel. Are there any in Zone 3?’ Darrel replies, ‘Yes, there is at least one red speckled ground squirrel in Zone 3.’ […] The animal Darrel saw in the river valley is a female red speckled ground squirrel, recently photographed by campers. Moreover, while Darrel was hiking back to camp, a male red speckled ground squirrel, which Darrel never saw, entered Zone 3 and made an offering of food to the female. The female accepted the male’s offering and they made a nest near the river. So there are two red speckled ground squirrels in Zone 3 after all.” (Suppl.)"
  - |
    Starmans and Friedman (2012) Burglar Control 1: “Peter is in his locked apartment reading, and is about to have a shower. He puts his book down on the coffee table, and takes off his black plastic watch and leaves it on the coffee table. Then he goes into the bathroom.

    As Peter’s shower begins, a burglar silently breaks into the apartment. The burglar takes Peter’s black plastic watch, replaces it with an identical black plastic watch […], and then leaves. Peter is still in the shower, and did not hear anything.” (275.) Participants were asked to evaluate whether or not Peter knows there is a book on the table at t~2~.
  - "Milk in the Fridge 1: After breakfast, Anna puts a half empty milk carton in her fridge and (based on her accurate perception) believes there is now milk in the fridge. Half an hour later, Anna’s flatmate asks whether there’s still milk in the fridge. Remembering accurately that she’s put it there, she replies that there is indeed milk in the fridge."
