name: "Change of Truth Value & Basis for Belief & Doxastic Attitude: Paradigmatic Knowledge to Paradigmatic Knowledge"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives or remembers in the moment.

    At t~2~ p is false and S believes that non-p based on a different instance of [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives or remembers in the moment.
comments: []
tokens:
  - "Milk in the Fridge 14: After breakfast, Anna puts a half empty milk carton in her fridge and (based on her accurate perception) believes there is now milk in the fridge. Returning from work, Anna sees a milk container in the recycling bin and, after a quick glance in the fridge, sees no container in there. She reasons that her flatmate finished it. She’s correct, there is no milk in the fridge."
