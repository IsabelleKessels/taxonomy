name: "Change of Truth Value & Basis for Belief: Paradigmatic Knowledge to Paradigmatic Lack of Knowledge"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception] and/or [Correct Reasoning From True Premises] relating to what S perceives or remembers in the moment.

    At t~2~ p is false, but S believes that p based on [Misperception] and/or [False Reasoning] relating to what S perceives or remembers in the moment.
comments:
  - "Since S gains a false belief at t~2~ in tokens of this [type], I will presume it’s uncontroversial that S *lacks knowledge*. X-phi results, though based on experiments with relatively small sample sizes, confirm this:"
  - "Starmans and Friedman (2012) investigated Pen Burglar Control 2 in their x-phi study and report: “Knowledge was attributed […] (14%) […] less than would be expected by chance (binomial, p < .001).” (276.) This vignette serves as one of the control cases for their case Pen Burglar, subsumed under C.8., [Change of Basis for Belief: Emerging Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]. For the other control case, see above, Burglar Control 1 [Change of Basis for Belief: Paradigmatic Knowledge to Paradigmatic Knowledge]. The control cases avoid the complicating factor of {{< sc >}}Truth From False Premise{{< /sc >}}. The experiment had a small sample size of n = 133 split across four conditions, with 35 participants excluded after failing comprehension tasks (276)."
  - "Turri (2013) investigated Pen Vibration Control in his x-phi study and reports: “[T]he knowledge ascription rate in Bad Luck [Pen Vibration 1; IK] was very low (16%) and below what could be expected by chance (binomial, p < 0.001).” (14.) This vignette serves as a control case for his case Vibration Pen, subsumed under C.8., [Change of Basis for Belief: Emerging Backup Truth-Maker – Paradigmatic Knowledge to Gettiered]. The control case avoids the complicating factor of {{< sc >}}Truth From False Premise{{< /sc >}}. His experiments use a very small sample size of around 25-30 participants per condition."
tokens:
  - "Starmans and Friedman’s (2012) Pen Burglar Control 2: “Katie is in her locked apartment writing a letter. She puts the letter and her blue Bic pen down on her coffee table. Then she goes into the bathroom to take a shower. As Katie’s shower begins, two burglars silently break into the apartment. One burglar takes Katie’s blue Bic pen from the table. But the other burglar absentmindedly leaves […] his own bandana […] on the coffee table. Then the burglars leave. Katie is still in the shower, and did not hear anything.” (276) Here, we’re interested in whether Katie knows that there is a pen on her desk."
  - "Turri’s (2013) Pen Vibration Control: “Grace is alone in the living room of her locked apartment, writing a letter with a blue Bic pen. She puts the letter and the blue Bic pen down on her coffee table and goes into the bathroom to take a quick shower. While she is in the shower, the apartment remains locked and nobody enters. […] Just as Grace began her shower, several construction vehicles drove by her apartment building. Because Grace was in the shower, she didn’t notice the traffic. […] But the vibrations from the construction traffic […] caused the blue Bic pen, which she had set down, to shift position, fall off the coffee table, and land on the floor. Because Grace was still in the shower, she didn’t notice that this happened.” (12) Here, we’re interested in whether Grace knows that there is a pen on her desk."
  - "Milk in the Fridge 10: After breakfast, Anna puts a half empty milk carton in her fridge and (based on her accurate perception) believes there is now milk in the fridge. The next morning, while preparing her coffee, Anna believes that there’s still milk in the fridge on the false premise that her flatmate would buy a fresh carton, should he finish the old one. In fact, however, her flatmate finished the milk and did not replace it."
