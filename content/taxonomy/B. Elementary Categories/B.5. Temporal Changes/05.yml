name: "Change of Basis for Belief & Doxastic Attitude: Paradigmatic Knowledge to Paradigmatic Lack of Knowledge"
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises].

    At t~2~ p is true, but S believes that non-p based on [Misperception], [Misremembering] and/or [False Reasoning].
comments:
  - "Since S gains a false belief at t~2~ in tokens of this [type], I will presume it’s uncontroversial that S *lacks knowledge*."
tokens:
  - "Milk in the Fridge 6: After breakfast, Anna puts a half empty milk carton in her fridge and (based on her accurate perception) believes there is now milk in the fridge. Half an hour later, Anna’s flatmate asks whether there’s still milk in the fridge. Misremembering that she’s finished the milk, she replies that there isn’t."
