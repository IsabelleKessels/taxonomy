name: "Change of Truth Value & Basis for Belief: Paradigmatic Lack of Knowledge to Paradigmatic Lack of Knowledge"
descriptions:
  - |
    [version #1] At t~1~ p is true, but S believes that p based on [Unsuitable Reason].

    At t~2~ p is false, but S believes that p based on [Misperception] and/or [False Reasoning] relating to what S perceives or remembers in the moment.
  - |
    [version #2] At t~1~ p is true, but S believes that non-p based on [Misperception] and/or [False Reasoning] relating to what S perceives or remembers in the moment.

    At t~2~ p is false, but S believes that non-p based on [Unsuitable Reason].
comments:
  - "Since S gains a false belief at t~2~ in tokens of version #1 of this [type], I will presume it’s uncontroversial that S *lacks knowledge* in version #1."
tokens:
  - "Milk in the Fridge 11: In the morning, Anna makes a bet with herself: If her coin toss lands on heads, she’ll believe that there *is* milk in the fridge. Her coin lands on tails and she forms the belief that there’s no milk in the fridge. As it so happens, this is true. Returning from work, Anna looks into the fridge and sees no milk carton there, and comes to believe that there’s still no milk in the fridge. In fact, there is milk hidden behind some food containers obstructing her view. (This token conforms with [version #1])"
  - "Milk in the Fridge 12: Upon waking, Anna forms the false belief that there’s no milk in the fridge, because she misremembers finishing the carton yesterday night. In fact, half a carton remains. Returning home from work, and wondering whether there might now be milk in the fridge, Anna makes a bet with herself: If her coin toss lands on heads, she’ll believe that there *is* milk in the fridge. Her coin lands on tails and she forms the belief that there’s no milk in the fridge. As it so happens, this is true, because her flatmate finished the rest of it with his breakfast. (This token conforms with [version #2])"
