name: "Change of Truth Value & Basis for Belief & Doxastic Attitude: Paradigmatic Lack of Knowledge to Paradigmatic Lack of Knowledge"
descriptions:
  - |
    [version #1] At t~1~ p is true, but S believes that p based on [Unsuitable Reason].

    At t~2~ p is false, but S believes that non-p based on a different instance of [Unsuitable Reason] than at t~1~.
  - |
    [version #2] At t~1~ p is true, but S believes that non-p based on [Misperception] and/or [False Reasoning] relating to what S perceives or remembers in the moment.

    At t~2~ p is false, but S believes that p based on a different instance of [Misperception] and/or [False Reasoning] relating to what S perceives or remembers in the moment.
comments:
  - "Since S gains a false belief at t~2~ in tokens of version #2 of this [type], I will presume it’s uncontroversial that S *lacks knowledge* in version #2."
tokens:
  - "Milk in the Fridge 15: In the morning, while preparing her coffee, she forms the belief that there’s milk in the fridge based on wishful thinking. Her flatmate placed a fresh carton of milk there yesterday evening, so Anna’s belief is true. The next morning, wondering whether there’s now milk in the fridge, Anna makes a bet with herself: If her coin toss lands on heads, she’ll believe that there *is* milk in the fridge. Her coin lands on tails and she forms the belief that there’s no milk in the fridge, and decides to skip her morning coffee. As it so happens, her belief is true, there really is no milk in the fridge. (This token conforms to [version #1].)"
  - "Milk in the Fridge 16: In the morning, Anna looks into the fridge and sees no milk carton there, and comes to believe that there’s none left. In fact, there is milk hidden behind some food containers obstructing her view. Returning from work, she looks again into the fridge and spots a milk carton, but doesn’t pick it up. She forms the belief that there is now milk in the fridge. In fact, her flatmate finished the milk that afternoon, and placed the empty carton back into the fridge. Anna’s belief is therefore false. (This token conforms to [version #2].)"
