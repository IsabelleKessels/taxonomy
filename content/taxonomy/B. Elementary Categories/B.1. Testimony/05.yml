name: "Correct Reasoning From an Unreliable Attester’s Testimony"
descriptions:
  - "R is an attester who sometimes lies about p-type propositions. R shows behaviour B~1~ whenever R is truthful regarding p-type propositions; and exhibits behaviour B~2~ whenever lying about such propositions. S is aware of this regularity. Hearing R attest that p~1~ while displaying behaviour B~1~, S correctly reasons that p~1~. p~1~ is true."
comments:
  - |
    Goldberg (2007a) states that Yankees Fan “is a case in which *the hearer’s testimony-based belief is safer, and so less susceptible to veritic luck, than is the testimony she herself consumed*” (323), leaving his own intuition implicit. The token receives attention in the armchair literature, for whether it amounts to “testimonial knowledge through unsafe testimony” (303); not for whether or not it amounts to an instance of knowledge (see also C.3., [Silent Approval of Counterfactual-Interference Affecting the Attester]).

    Pelling (2013) comments: “Ralph’s testimony is not unsafe, the result is that YANKEE FAN is not an instance of safe testimonial belief based on unsafe testimony.” (213.)
tokens:
  - "Goldberg’s (2007a) Yankees Fan: “Ralph is a rabid fan of the New York Yankees. […] [T]hough he acquires a good many of his beliefs about the Yankees from reliable sources […], he also acquires a good many Yankee-beliefs through wishful thinking. Indeed, when the reliable sources give him information that is too difficult for him (i.e., reports of a Yankees’ loss), he forgets what he read, and his wishful thinking takes over[.] […] [H]e offers about as much false testimony about the Yankees as true testimony about the Yankees. […] Whenever he asserts beliefs originally formed through wishful thinking, […] there is a certain lack of confidence exhibited in his speech on those occasions, he can’t look you in the eyes, etc. […] [When he asserts] beliefs originally formed through reliable means are reliably associated with characteristics […] he expresses himself with a good deal of confidence, he can look you in the eyes, and so forth. […] Suppose that Mary can and does discriminate the relevant features of Ralph’s Yankees-testimony, and […] accepts Ralph’s Yankees-testimony when it has the features indicating that it came from a reliable source […], but does not accept his testimony when it has the features indicating that it came from an unreliable source (wishful thinking).” (322f.)"
