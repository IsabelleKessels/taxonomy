name: "Unbelieving Attester"
descriptions:
  - "Due to some reason (religious belief, superstition, etc.), a trustworthy and reliable attester, R, refrains from forming the belief that p, even though R is aware of highly reliable evidence indicating that p is true. On the grounds of this evidence, R asserts that p to S (who doesn’t share R’s religious belief, superstition, etc.). S forms the belief that p. p is true."
comments:
  - |
    Case-tokens vary as to whether R additionally attests the relevant evidence for p to S. In Creationist Teacher, it’s plausible that evidence for p would be implicitly or explicitly provided by the teacher alongside their assertion that p.

    As Grant Scholars illustrates, tokens of this [type] often use long testimonial chains to generate a situation where none of the attesters form the belief that p and the receiver appears to be the first one to believe this proposition.

    Such cases play a central role in the debate about whether testimonial knowledge is gained through the *transmission of knowledge* (making the attester’s knowledge a necessary condition for the receiver’s knowledge), or whether some other epistemic ingredient is transmitted through testimony (see, e.g., Welbourne 1979; Audi 1997; Lackey 1999; Carter & Nickel 2014; Wright 2016). Those who claim that S gains knowledge in tokens of this [type] emphasise the social role of attesting: As long as the attester behaves responsibly and is aware that their hesitation to believe that p is solely due to conflicting personal beliefs, they still function as an adequate source. Those who claim S doesn’t gain knowledge emphasise the transmissive function of testimony, holding that if knowledge isn’t held by the attester, it can’t be gained by the receiver (see, e.g., Audi 2006, 43).

    Lackey (2008) intuits about Creationist Teacher: “[B]ecause she reliably conveys this information to her fourth-grade students, and does not provide them with any relevant undefeated defeaters, they acquire the knowledge (justified/warranted belief) in question on the basis of her testimony.” (48.)

  - "Carter and Nickel (2014) don’t explicitly state their knowledge-intuition about Grant Scholars, but they seem to accept that the students gain knowledge as an implicit premise."
tokens:
  - "Lackey’s (2008) Creationist Teacher: “Stella is a devoutly Christian fourth-grade teacher, […] [p]art of this faith includes a belief in the truth of creationism and, accordingly, a belief in the falsity of evolutionary theory. Despite this, she fully recognizes that there is an overwhelming amount of scientific evidence against both of these beliefs. Indeed, she readily admits that she is not basing her own commitment to creationism on evidence at all but, rather, on the personal faith that she has in an all-powerful Creator. Because of this, Stella does not think that religion is something that she should impose on those around her, and this is especially true with respect to her fourth-grade students. Instead, she regards her duty as a teacher to involve presenting material that is best supported by the available evidence, which clearly includes the truth of evolutionary theory. As a result, after consulting reliable sources in the library and developing reliable lecture notes, Stella asserts to her students, “Modern-day *Homo sapiens* evolved from *Homo erectus*,” while presenting her biology lesson today. Though Stella herself neither believes nor knows this proposition, she never shares her own personal faith-based views with her students, and so they form the corresponding true belief solely on the basis of her reliable testimony.” (48.) This is an adapted version of a case presented in Lackey (1999) (477)."
  - "Carter and Nickel’s (2014) Grant Scholars: “Let φ represent the name of a particle that was, until recently, merely a *theoretical postulate*. Aside from the fact that a prominent scientific theory T predicts the existence of φ, there has been no observational evidence of φ. Suppose further that observational evidence of φ would be compelling evidence against religious tenet R. Suppose now that we have got three esteemed and very capable particle physicists, A, B and C, each of which (i) is, like Stella, devoutly religious and believes religious tenet R, and (ii) has been awarded tremendously generous research grants by a religiously affiliated funding body, God and Truth. While God and Truth has given the generous research funds to A, B and C because they are both brilliant and religious, there are no strings attached to the research money. With their (extremely) generous funding, each sets up a highly sophisticated laboratory setting, expecting to demonstrate on scientific grounds that φ is not observed in ideal conditions. As it turns out, though, A observes φ. A submits the paper detailing this finding to Nature, which sends the paper to the two most qualified experts: B and C. B and C, through their funding, are able carefully to repeat A’s experiment conditions and verify the result and the paper is accordingly accepted. Stella, in her elective upper-level high school physics class, teaches the result: that φ exists, confirming T and effectively disproving R. In this case, not only did Stella not believe what she says, but neither did A, who published the paper, nor did B or C, who refereed the paper at Nature.” (150.)"
