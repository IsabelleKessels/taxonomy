name: "Direct Cognitive Help"
descriptions:
  - "Some factor influences S’s normal belief-formation processes, setting S into a state of believing that p, and p is true."
comments:
  - "Plantinga (1988) intuits about Brain Lesion: “[S]urely K does not know that he is suffering from a brain lesion. He has no evidence of any kind – sensory, memory, introspective, whatever – that he has such a lesion; his holding this belief is, from a cognitive point of view, no more than a lucky (or unlucky) accident.” (22f.)"
  - |
    Lehrer (1990) intuits about Truetemp: “He has no idea whether he or his thoughts about the temperature are reliable. […] He has no idea why the thought occurred to him or that such thoughts are almost always correct. He does not, consequently, know that the temperature is 104 degrees when that thought occurs to him.” (163.) Swain et al. (2008) use a vignette closely modelled after Truetemp in their x-phi study. Their data indicates there is an order effect: “[S]ubjects who are first presented with a clear case of non-knowledge are significantly more willing to attribute knowledge in the Truetemp Case (p = .043). This is an important finding because the increase from 2.64 to 3.31 crosses the threshold of neutrality (3.0 = neutral).” (144.) Wright (2010) corroborates their findings. Ziółkowski et al. (2023), however, report: “None of Swain et al.’s (2008) predictions concerning order effects with Truetemp cases could be consistently and robustly replicated in our three experiments, and it is thus at best unclear whether Truetemp intuitions are in fact unstable.” (107.) Measured on a Likert scale from 1 to 5, they report the following results for Truetemp, when presented first (this condition is indexed as ‘Baseline’), or after a case of knowledge, or lack thereof, respectively: “M~Baseline~ = 3.61 (SD~Baseline~ = 1.31), M~Knowledge~ = 3.47 (1.32), M~Non-Knowledge~ = 3.53 (1.26).” (107.)

    Ziółkowski et al.’s (2023) replication of Swain et al.’s (2008) experiment used a significantly larger sample of n = 1626, split across three conditions (108). Swain et al.’s (2008) original experiment had a sample size of n = 220 split across eight conditions (141f.) and Wright’s (2010) two experiments had n = 188 (492) and n = 181 (496). Wright doesn’t specify the number of conditions participants were split between.
  - "Cullen (2010) conducted a small-scale study investigating the effect of including an instruction that each case should be evaluated individually (rather than evaluating later cases in comparison to the preceding ones) in the study design. Testing for order effects between Truetemp (referred to as ‘Charles’) being presented before or after a case-token of [Unsuitable Reason] (‘Dave’), he reports: “Comparing subjects who considered Dave’s case before considering Charles’ (N = 26; mean response to Charles = 2.58 [95%CI: 2.06–3.01]) to those who considered Charles’ first (N = 24; mean response = 2.5 [95%CI: 2.94–2.06]) shows that subjects’ judgments about Charles’ case are not affected by first considering Dave’s (p = 0.8). It appears from this preliminary data that when the conversational context is made explicit in this way, the priming effect disappears.” (285.) What all these results share is that, when measured on a Likert scale, the mean evaluation tends towards the neutral middle. Cullen (2010) also tested the effect of using alternative ways of testing participant’s intuition: comparing between the results of a group of 70 participants asked to choose whether Truetemp ‘really knows’ or ‘only beliefs’ and another group of 214 participants asked whether he ‘knows’ or ‘doesn’t know’: “Only 28% of subjects in the non-dichotomous group answered ‘really knows’, compared with 57% of subjects in the dichotomous group who answered ‘knows’ (p < .0001) – that is, subjects were twice as likely to respond ‘knows’ than ‘really knows’” (288)."
tokens:
  - "Plantinga’s (1988) Brain Lesion: “K suffers from a serious abnormality – a brain lesion, let’s say. This lesion wreaks havoc with K’s noetic structure, causing him to believe an array of propositions most of which are absurdly false. It also causes him to believe, however, that he is suffering from a brain lesion. K hasn’t the slightest shred of evidence for this belief; and he thinks of his other unusual beliefs as resulting from no more than an engagingly original turn of mind.” (22.)"
  - "Lehrer’s (1990) Truetemp: “Mr. Truetemp, undergoes brain surgery by an experimental surgeon who invents a small device which is both a very accurate thermometer and a computational device capable of generating thoughts. The device, call it a tempucomp, is implanted in Truetemp’s head so that the very tip of the device, no larger than the head of pin, sits unnoticed on his scalp and acts as a sensor to transmit information about the temperature to the computational system in his brain. This device, in turn, sends a message to his brain causing him to think of the temperature recorded by the external sensor. Assume that the tempucomp is very reliable, and so his thoughts are correct temperature thoughts. […] [Truetemp; IK] has no idea that the tempucomp has been inserted in his brain, is only slightly puzzled about why he thinks so obsessively about the temperature, but never checks a thermometer to determine whether these thoughts about the temperature are correct. He accepts them unreflectively, another effect of the tempucomp. Thus, he thinks and accepts that the temperature is 104 degrees. It is.” (162f.)"
