name: "Sensory Help"
descriptions:
  - "Some factor influences S’s sensory organs or perceptual process such that S’s perception is improved. This enables S to form the true belief that p based on [Clear Perception]. "
comments:
  - "The distinction between external interference and internal sensory enhancement/impairment is not always clear. While a laser eye operation or a CI clearly influences the sense organ, the case is less clear for a pair of glasses or hearing aids. Should these be classified as an extension of the agent’s sense organs and perception process, or as environmental circumstances, along with, say, ‘the view being clear’ or ‘no significant background noise’? This seems to be a context-sensitive matter; and I make no definite claims on either these matters."
  - |
    I’m unaware of armchair based intuition-reports or empirical studies investigating intuitions on tokens of this [case-type]; but I suspect the evaluation of case-tokens can swing either way, depending on whether S is sufficiently experienced in interpreting the influenced data. The threshold for this need not be high: Agents using reading glasses for the first time might be sufficiently acquainted with its influence on their perception within seconds. In other cases, e.g., receiving an CI, it might require a period of getting used to. The threshold will usually be met if:

    -	the influence on S’s sensory organs or perceptual process is permanent and was implemented some time ago; or
    -	the influence is temporary, but S has significant control over whether or not the factor is implemented in any given moment (e.g., using prescription contact lenses or binoculars, as in Birdwatcher 2.

    The threshold will usually not be met if:

    -	the influence takes place sporadically and its cause and impact on perception is incomprehensible to S.

    Accordingly, [sub-types] may need to be formulated.
  - "Laser eye surgery or CIs are forms of *help* that, to my mind, clearly don’t undermine knowledge; i.e, S knows the car honked, even if S’s belief that the car honked is facilitated in part by a CI. Such agents are aware and consent that they are operated on (a detail not always true of agents in science-fictionesque epistemological thought experiments). The changes to S’s sensory organs or perceptual process are permanent in the cases of laser eye surgery or the CI. Moreover, they go through a phase of re-adjustment in which they learn to interpret the acoustic stimulus they receive via the CI. – Beebe (2004) criticises Lehrer’s (1990) Truetemp (see [Direct Cognitive Help]), noting that people undergoing surgery like the implementation of a CI report of “shock and confusion” and of having to “go through a difficult period of adjustment” (311). Forming reliable beliefs with the help of the implant requires a learning / skill development process after which agents gain knowledge based on their new skill. Given this evidence, he claims that Truetemp is formulated in a tendentious way: S forms beliefs based on the device straight away, which seems unrealistic (312). I hold that the two case-tokens are actually not fully analogous: Truetemp is a case-token of [Direct Cognitive Help], and the CI case is a token of [Sensory Help]. Yet, I agree that Beebe’s considerations about the learning process are highly relevant to [Sensory Help] case-tokens, and possibly also to [Indirect Cognitive Help] case-tokens."
  - "Backstreet Demon is a case token where the changes are temporary, the agent went through no sensory re-adjustment, and has no control over when or whether the change is instantiated. I hold that Steffi lacks knowledge: if she is appropriately epistemically cautious, she will be sceptical about her extra-ordinary perception and suspend judgement on the cat’s colour."
tokens:
  - "Common application cases are laser eye surgery and cochlear implants (CI)."
  - "Infrared Vision: Scientists recently experimented with “ocular injectable, self-powered, built-in NIR light nanoantenna that can extend the mammalian visual spectrum to the NIR [near-infrared] range” (Ma et al. 2019, 223) or, simply put, nanoparticles that are injected into the eyes of mice to allow them to perceive near-infrared light. Suppose some mad scientists injects these nanoparticles into a human’s, Sally’s, eyes; the experiment is successful, and the nanoparticles work equivalently in a human’s eye to a mouse’s. The scientist presents Sally with a projection of a circle in near-infrared light and asks her what she sees. Sally sees a circle. However, the injection irritated Sally’s retia to some extent, so that she sometimes sees random glowing shapes. Sally isn’t aware that these shapes are not caused by near-infrared light waves. She is not yet reliable at judging whether or not she sees near-infrared stimuli."
  - "Backstreet Demon: Steffi looks out of her window at midnight as a cat crosses the unlit backstreet. Normally, the light conditions would not be sufficient to stimulate Steffi’s cone cells, i.e., she would perceive shapes but not colours, and thus couldn’t see that the cat’s fur is orange. However, a demon spontaneously tampers with Steffi’s eyes, making her cone cells more sensitive. Her perceptions lead her to form the belief: “that cat has an orange fur.” In the next moment, however, the demon’s interference stops and Steffi goes back to merely perceiving the backstreet scenario in greys."
  - "Birdwatcher 2: Stefan is watching birds in the garden. He spots a small brown bird. Using binoculars to get a better look, he comes to believe that there’s a dunnock in the garden. The bird he has spotted is indeed a dunnock."
