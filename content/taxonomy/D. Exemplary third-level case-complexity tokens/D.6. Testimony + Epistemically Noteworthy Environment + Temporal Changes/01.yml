name: "Change of Basis for Belief: Paradigmatic Knowledge to Unfriendly Environment for Accepting Testimony"
open: true
descriptions:
  - |
    At t~1~ p is true and S believes that p based on [Clear Perception], [Accurate Memory] and/or [Correct Reasoning From True Premises].

    At t~2~ p is true and S believes that p based on remembering the evidence S gathered at t~1~. However, S is in an environment which contains misleading evidence in the form of [False Testimony] in regards to whether p. As it so happens, S isn’t subjected to this [False Testimony], but if S were, S would reject the evidence S has in support for p and form the false belief that non-p.
comments:
  - "Harman (1973) intuits about Unopened Letters: “[Y]ou do not know that Donald is in Italy. Your knowledge is undermined by evidence you do not as yet possess.” (143.) "
  - "Horvath and Wiegmann (2016) introduce CEO’s Painting as a case “modeled after the case of Donald and the unopened letter” (2709). Their experiment investigated whether lay people’s intuitions would diverge from philosophers. They report: “For the Painting case […] no significant difference between lay subjects and expert subjects was found (p = .52 […]).” (2712.) While they don’t report the exact mean evaluations, figure 1 indicates that either group’s evaluation lies around the 4.5 mark on a 6-point Likert scale where 1 would represent strong disagreement and 6 strong agreement with the claim that the CEO knows (2712). Their experiment had a sample size of n = 224 (whereof 82 were classified as experts and 142 as lay people) (2711)."
  - "In Tom Grabit, the possibility of encountering the misleading evidence appears more remote than in the other tokens. Lehrer and Paxson (1969) intuit about Tom Grabit: “[I]t should be apparent that I did know that Tom Grabit removed the book[.]” (228.) Harman (1973) also gives his intuition on Tom Grabit: “In these circumstances I do not know that Tom stole the book. My knowledge is undermined by evidence I do not possess.” (143.)"
tokens:
  - "Harman’s (1973) Unopened Letters: “Donald has gone off to Italy. He told you ahead of time that he was going; and you saw him off at the airport. He said he was to stay for the entire summer. That was in June. It is now July. Then you might know that he is in Italy. It is the sort of thing one often claims to know. However, for reasons of his own Donald wants you to believe that he is not in Italy but in California. He writes several letters saying that he has gone to San Francisco and has decided to stay there for the summer. He wants you to think that these letters were written by him in San Francisco, so he sends them to someone he knows there and has that person mail them to you with a San Francisco postmark, one at a time. You have been out of town for a couple of days and have not read any of the letters. You are now standing before the pile of mail that arrived while you were away. Two of the phony letters are in the pile. You are about to open your mail. I ask you, “Do you know where Donald is?” “Yes,” you reply, “I know that he is in Italy.” You are right about where Donald is and it would seem that your justification for believing that Donald is in Italy makes no reference to letters from San Francisco.” (143.)"
  - |
    Horvath and Wiegmann’s (2016) CEO’s Painting: “A CEO has owned a famous painting for a long time. Just this morning, she showed it to a colleague in her office where she can watch the painting every day. In the evening, the CEO returns home from work and is about to check her email. What she will find there is an urgent note form her secretary that says that her painting was stolen shortly after she had left her office. In fact, the CEO’s colleague merely wanted to play a trick on her, and so it was actually him who used the secretary’s email account to send her this note. The painting itself is still on the CEO’s office wall, just as it always was.

    How much do you disagree or agree with the following claim:

    *At the time when the CEO returns home, but before she actually checks her email, she knows the painting is still on her office wall.*” (2709.)
  - "Lehrer and Paxson’s (1969) Tom Grabit: “Suppose I see a man walk into the library and remove a book from the library by concealing it beneath his coat. Since I am sure the man is Tom Grabit, whom I have often seen before when he attended my classes, I report that I know that Tom Grabit has removed the book. However, suppose further that Mrs. Grabit, the mother of Tom, has averred that on the day in question Tom was not in the library, indeed, was thousands of miles away, and that Tom’s identical twin brother, John Grabit, was in the library. Imagine, moreover, that I am entirely ignorant of the fact that Mrs. Grabit has said these things. […] Mrs. Grabit is a compulsive and pathological liar, […] John Grabit is a fiction of her demented mind, and […] Tom Grabit took the book as I believed.” (228.)"
