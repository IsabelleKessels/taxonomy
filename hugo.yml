baseURL: "https://test.hasselkuss.com/txm/" #"https://isabellekessels.github.io/taxonomy/"
locale: "en-gb"
title: "TXM"
copyright: "&copy; {currentYear} Isabelle Keßels"

disableKinds:
  - taxonomy
  - term

# Add search JSON
outputs:
  home:
    - HTML
    - JSON

menu:
  home:
    - name: Taxonomy
      pageRef: "/taxonomy"
      Params:
        class: button--active
      weight: 10
    - name: Source
      url: "https://github.com/IsabelleKessels/taxonomy"
  social:
    - title: Source on GitHub
      identifier: Source
      url: "https://github.com/IsabelleKessels/taxonomy"
      Params:
        icon: "img/icons/github.svg"

cascade:
  - build:
      publishResources: false

# ToC and Markup config from the module
markup:
  _merge: shallow
  goldmark:
    extensions:
      strikethrough: false
      extras:
        subscript:
          enable: true
        superscript:
          enable: true
    parser:
      attribute:
        block: true
        title: true
    renderer:
      unsafe: true

module:
  imports:
    - path: "github.com/paulHasselkuss/W210"
